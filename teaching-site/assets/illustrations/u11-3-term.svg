<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u11-term-title u11-term-desc">
  <title id="u11-term-title">Unit 11｜專業術語解釋</title>
  <desc id="u11-term-desc">把抽象名詞變成可快速複習的概念圖卡。</desc>
  <defs>
    <linearGradient id="u11-term-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="u11-term-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u11-term-bg)"/>
  <circle cx="1060" cy="96" r="96" fill="#16a34a" opacity="0.08"/>
  <text x="56" y="70" fill="#0f172a" font-size="32" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Unit 11｜專業術語解釋</text>
  <text x="58" y="106" fill="#475569" font-size="17" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">部署到 Docker 伺服器的四個核心名詞</text>

  <g filter="url(#u11-term-shadow)">
    <rect x="72" y="152" width="516" height="220" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="104" y="188" width="64" height="64" rx="18" fill="#eff6ff"/>
    <text x="120" y="232" fill="#2563eb" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">R</text>
    <text x="192" y="230" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Registry 映像倉庫</text>
    <text x="104" y="292" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">映像的集中倉庫（如 GHCR）：開發機 push 上去，任何</text>
    <text x="104" y="322" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">伺服器 pull 下來；推上去的映像預設保持私有。</text>
  </g>

  <g filter="url(#u11-term-shadow)">
    <rect x="612" y="152" width="516" height="220" rx="24" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="644" y="188" width="64" height="64" rx="18" fill="#fff7ed"/>
    <text x="660" y="232" fill="#d97706" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">S</text>
    <text x="732" y="230" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">save / load 免倉庫搬運</text>
    <text x="644" y="292" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">把映像匯出成 tar 檔帶去目標機器再載入；零依賴、</text>
    <text x="644" y="322" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">免帳號免對外網路，內網部署與緊急救援的救命招。</text>
  </g>

  <g filter="url(#u11-term-shadow)">
    <rect x="72" y="404" width="516" height="220" rx="24" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="104" y="440" width="64" height="64" rx="18" fill="#ecfdf5"/>
    <text x="120" y="484" fill="#16a34a" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">E</text>
    <text x="192" y="482" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">.env 設定注入</text>
    <text x="104" y="544" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">每個環境一份、只存在伺服器上、永不進 git；</text>
    <text x="104" y="574" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">APP_VERSION 一行控制整套系統跑哪個版本。</text>
  </g>

  <g filter="url(#u11-term-shadow)">
    <rect x="612" y="404" width="516" height="220" rx="24" fill="#ffffff" stroke="#fecaca"/>
    <rect x="644" y="440" width="64" height="64" rx="18" fill="#fef2f2"/>
    <text x="658" y="484" fill="#e11d48" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">B</text>
    <text x="732" y="482" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Rollback 退版</text>
    <text x="644" y="544" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">新版出問題時把版本號改回舊 tag 重新拉起；靠舊映像</text>
    <text x="644" y="574" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">保留與 volume 資料分離，一分鐘內完成且資料無損。</text>
  </g>
</svg>

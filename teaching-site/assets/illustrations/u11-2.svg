<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u11-diagram-title u11-diagram-desc">
  <title id="u11-diagram-title">Unit 11｜更新與退版流程</title>
  <desc id="u11-diagram-desc">APP_VERSION 換版、pull 與 up 重新拉起、有問題改回舊 tag 一鍵退版。</desc>
  <defs>
    <linearGradient id="u11-diagram-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="u11-diagram-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="u11-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#16a34a"/>
    </marker>
    <marker id="u11-arrow-back" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u11-diagram-bg)"/>
  <text x="56" y="70" fill="#0f172a" font-size="32" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">更新與退版流程</text>
  <text x="58" y="106" fill="#475569" font-size="17" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">換版只換 tag：映像到處搬但永不修改、設定留在 .env、資料在 volume 原地不動</text>

  <!-- 步驟一：發布新版 -->
  <g filter="url(#u11-diagram-shadow)">
    <rect x="72" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="72" y="200" width="300" height="52" rx="24" fill="#2563eb"/>
    <text x="100" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">① 發布新版本</text>
    <rect x="100" y="276" width="244" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="118" y="304" fill="#2563eb" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">build → tag 1.1.0</text>
    <rect x="100" y="332" width="244" height="44" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="118" y="360" fill="#d97706" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">push GHCR 或 save/load</text>
    <rect x="100" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="118" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">1.0.0 映像保留不刪</text>
  </g>

  <!-- 步驟二：伺服器換版 -->
  <g filter="url(#u11-diagram-shadow)">
    <rect x="452" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="452" y="200" width="300" height="52" rx="24" fill="#16a34a"/>
    <text x="480" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">② 伺服器換版</text>
    <rect x="480" y="276" width="244" height="44" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="498" y="304" fill="#16a34a" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">.env：APP_VERSION=1.1.0</text>
    <rect x="480" y="332" width="244" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="498" y="360" fill="#2563eb" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">compose pull · up -d</text>
    <rect x="480" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="498" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">ps 確認 healthy · 盯 log</text>
  </g>

  <!-- 步驟三：驗證或退版 -->
  <g filter="url(#u11-diagram-shadow)">
    <rect x="832" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#fecaca"/>
    <rect x="832" y="200" width="300" height="52" rx="24" fill="#e11d48"/>
    <text x="860" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">③ 出問題？一鍵退版</text>
    <rect x="860" y="276" width="244" height="44" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="878" y="304" fill="#e11d48" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">APP_VERSION 改回 1.0.0</text>
    <rect x="860" y="332" width="244" height="44" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="878" y="360" fill="#16a34a" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">up -d → 畫面退回舊版</text>
    <rect x="860" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="878" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">資料在 volume · 原地不動</text>
  </g>

  <!-- 流程箭頭 -->
  <path d="M372 320 C404 320 420 320 448 320" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" marker-end="url(#u11-arrow)"/>
  <path d="M752 320 C784 320 800 320 828 320" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" marker-end="url(#u11-arrow)"/>
  <path d="M960 444 C960 484 760 484 620 452" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#u11-arrow-back)"/>
  <text x="700" y="500" fill="#e11d48" font-size="14" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">退版＝換回舊 tag，一分鐘內完成</text>

  <!-- 底部提醒 chips -->
  <g transform="translate(88,540)">
    <rect width="480" height="96" rx="20" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="28" y="40" fill="#16a34a" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">退版能快的兩個前提</text>
    <text x="28" y="72" fill="#64748b" font-size="15" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">舊 tag 映像還在（沒被 latest 覆蓋）· 資料在 volume 不跟映像走</text>
  </g>
  <g transform="translate(632,540)">
    <rect width="480" height="96" rx="20" fill="#ffffff" stroke="#fed7aa"/>
    <text x="28" y="40" fill="#d97706" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">誠實的限制</text>
    <text x="28" y="72" fill="#64748b" font-size="15" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">不可逆的 DB migration 退不掉——Flyway 要保持向後相容一版</text>
  </g>
</svg>

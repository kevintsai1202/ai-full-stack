<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u11-hero-title u11-hero-desc">
  <title id="u11-hero-title">Unit 11｜部署到 Docker 伺服器</title>
  <desc id="u11-hero-desc">映像、設定、資料三分離：從開發機搬到伺服器</desc>
  <defs>
    <linearGradient id="u11-hero-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="52%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="u11-hero-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="u11-hero-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u11-hero-bg)"/>
  <path d="M0 126 C220 40 335 120 520 62 C715 0 835 82 1200 26 L1200 0 L0 0 Z" fill="#16a34a" opacity="0.1"/>
  <circle cx="1030" cy="108" r="116" fill="#16a34a" opacity="0.09"/>
  <circle cx="112" cy="572" r="92" fill="#2563eb" opacity="0.08"/>
  <text x="56" y="70" fill="#0f172a" font-size="34" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Unit 11｜部署到 Docker 伺服器</text>
  <text x="58" y="108" fill="#475569" font-size="18" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">搬運、上線、更新與退版：映像／設定／資料三分離</text>

  <!-- 開發機 -->
  <g filter="url(#u11-hero-shadow)">
    <rect x="64" y="180" width="340" height="300" rx="28" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="64" y="180" width="340" height="60" rx="28" fill="#0f172a"/>
    <text x="96" y="218" fill="#e2e8f0" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">開發機 · 有版本號的映像</text>
    <rect x="96" y="264" width="276" height="52" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="116" y="296" fill="#2563eb" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">backend:1.0.0 / 1.1.0</text>
    <rect x="96" y="330" width="276" height="52" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="116" y="362" fill="#16a34a" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">frontend:1.0.0 / 1.1.0</text>
    <rect x="96" y="396" width="276" height="52" rx="14" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="116" y="428" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">舊 tag 保留 = 退版保險</text>
  </g>

  <!-- 兩條搬運路線 -->
  <path d="M412 280 C470 280 480 262 530 262" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14" marker-end="url(#u11-hero-arrow)"/>
  <text x="428" y="246" fill="#d97706" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">A：save / load 免 registry</text>
  <path d="M412 396 C470 396 480 414 530 414" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#u11-hero-arrow)"/>
  <text x="428" y="452" fill="#2563eb" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">B：push / pull GHCR</text>

  <!-- 伺服器 -->
  <g filter="url(#u11-hero-shadow)">
    <rect x="548" y="180" width="588" height="300" rx="28" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="548" y="180" width="588" height="60" rx="28" fill="#16a34a"/>
    <text x="580" y="218" fill="#ffffff" font-size="18" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Docker 伺服器 · compose up -d</text>
    <rect x="580" y="264" width="256" height="88" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="600" y="296" fill="#2563eb" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">映像 image:${APP_VERSION}</text>
    <text x="600" y="324" fill="#64748b" font-size="13" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">換版＝改一行版本號</text>
    <rect x="856" y="264" width="256" height="88" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="876" y="296" fill="#d97706" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">設定 .env（不進 git）</text>
    <text x="876" y="324" fill="#64748b" font-size="13" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">密碼全換生產專用值</text>
    <rect x="580" y="368" width="256" height="88" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="600" y="400" fill="#0891b2" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">資料 named volume</text>
    <text x="600" y="428" fill="#64748b" font-size="13" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">換版退版都不動資料</text>
    <rect x="856" y="368" width="256" height="88" rx="16" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="876" y="400" fill="#475569" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">最小暴露：只開 80</text>
    <text x="876" y="428" fill="#64748b" font-size="13" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">DB／後端不對外 · restart 必設</text>
  </g>

  <!-- 底部流程 chips -->
  <g transform="translate(88,548)">
    <rect width="230" height="54" rx="27" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <circle cx="30" cy="27" r="10" fill="#d97706"/>
    <text x="52" y="34" fill="#0f172a" font-size="17" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">映像搬運</text>
  </g>
  <g transform="translate(358,548)">
    <rect width="230" height="54" rx="27" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="30" cy="27" r="10" fill="#16a34a"/>
    <text x="52" y="34" fill="#0f172a" font-size="17" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">compose 上線</text>
  </g>
  <g transform="translate(628,548)">
    <rect width="230" height="54" rx="27" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="30" cy="27" r="10" fill="#2563eb"/>
    <text x="52" y="34" fill="#0f172a" font-size="17" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">外部驗收</text>
  </g>
  <g transform="translate(898,548)">
    <rect width="230" height="54" rx="27" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="30" cy="27" r="10" fill="#7c3aed"/>
    <text x="52" y="34" fill="#0f172a" font-size="17" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">更新與退版</text>
  </g>
</svg>

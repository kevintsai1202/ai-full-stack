<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u10-term-title u10-term-desc">
  <title id="u10-term-title">Unit 10｜專業術語解釋</title>
  <desc id="u10-term-desc">把抽象名詞變成可快速複習的概念圖卡。</desc>
  <defs>
    <linearGradient id="u10-term-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="u10-term-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u10-term-bg)"/>
  <circle cx="1060" cy="96" r="96" fill="#2563eb" opacity="0.08"/>
  <text x="56" y="70" fill="#0f172a" font-size="32" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Unit 10｜專業術語解釋</text>
  <text x="58" y="106" fill="#475569" font-size="17" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Docker 映像打包的四個核心名詞</text>

  <g filter="url(#u10-term-shadow)">
    <rect x="72" y="152" width="516" height="220" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="104" y="188" width="64" height="64" rx="18" fill="#eff6ff"/>
    <text x="126" y="232" fill="#2563eb" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">I</text>
    <text x="192" y="230" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Image 映像</text>
    <text x="104" y="292" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">不可變的交付物：程式碼、依賴、執行環境一次封死，</text>
    <text x="104" y="322" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">搬到任何裝了 Docker 的機器上，行為都一致。</text>
  </g>

  <g filter="url(#u10-term-shadow)">
    <rect x="612" y="152" width="516" height="220" rx="24" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="644" y="188" width="64" height="64" rx="18" fill="#ecfdf5"/>
    <text x="660" y="232" fill="#16a34a" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">L</text>
    <text x="732" y="230" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Layer Cache 層快取</text>
    <text x="644" y="292" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Docker 逐層快取建置結果；把依賴與原始碼拆成兩層，</text>
    <text x="644" y="322" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">改一行程式碼的重建時間從幾分鐘縮到幾十秒。</text>
  </g>

  <g filter="url(#u10-term-shadow)">
    <rect x="72" y="404" width="516" height="220" rx="24" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="104" y="440" width="64" height="64" rx="18" fill="#fff7ed"/>
    <text x="118" y="484" fill="#d97706" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">D</text>
    <text x="192" y="482" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">.dockerignore 建置排除</text>
    <text x="104" y="544" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">擋住不該進建置 context 的檔案：node_modules、.git，</text>
    <text x="104" y="574" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">尤其是 .env——密碼一旦進映像就跟著到處外洩。</text>
  </g>

  <g filter="url(#u10-term-shadow)">
    <rect x="612" y="404" width="516" height="220" rx="24" fill="#ffffff" stroke="#ddd6fe"/>
    <rect x="644" y="440" width="64" height="64" rx="18" fill="#f5f3ff"/>
    <text x="658" y="484" fill="#7c3aed" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">T</text>
    <text x="732" y="482" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Tag 版本標籤</text>
    <text x="644" y="544" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">latest 只是會被覆蓋的浮動標籤；每次建置打明確版本，</text>
    <text x="644" y="574" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">舊 tag 留在機器上，就是之後一鍵退版的保險。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u12-term-title u12-term-desc">
  <title id="u12-term-title">Unit 12｜專業術語解釋</title>
  <desc id="u12-term-desc">把抽象名詞變成可快速複習的概念圖卡。</desc>
  <defs>
    <linearGradient id="u12-term-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="u12-term-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u12-term-bg)"/>
  <circle cx="1060" cy="96" r="96" fill="#7c3aed" opacity="0.08"/>
  <text x="56" y="70" fill="#0f172a" font-size="32" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Unit 12｜專業術語解釋</text>
  <text x="58" y="106" fill="#475569" font-size="17" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Kubernetes 初體驗的四個核心名詞</text>

  <g filter="url(#u12-term-shadow)">
    <rect x="72" y="152" width="516" height="220" rx="24" fill="#ffffff" stroke="#ddd6fe"/>
    <rect x="104" y="188" width="64" height="64" rx="18" fill="#f5f3ff"/>
    <text x="118" y="232" fill="#7c3aed" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">D</text>
    <text x="192" y="230" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Deployment 部署宣告</text>
    <text x="104" y="292" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">宣告某服務要跑幾個副本、用哪個映像、吃哪些設定；</text>
    <text x="104" y="322" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">k8s 負責讓現實永遠維持宣告的樣子（自癒的來源）。</text>
  </g>

  <g filter="url(#u12-term-shadow)">
    <rect x="612" y="152" width="516" height="220" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="644" y="188" width="64" height="64" rx="18" fill="#eff6ff"/>
    <text x="662" y="232" fill="#2563eb" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">S</text>
    <text x="732" y="230" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Service 服務入口</text>
    <text x="644" y="292" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">副本的穩定門牌：叢集內部 DNS 名稱不變，背後自動</text>
    <text x="644" y="322" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">把流量分給多個 Pod——對應 compose 的服務名互連。</text>
  </g>

  <g filter="url(#u12-term-shadow)">
    <rect x="72" y="404" width="516" height="220" rx="24" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="104" y="440" width="64" height="64" rx="18" fill="#fff7ed"/>
    <text x="118" y="484" fill="#d97706" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">C</text>
    <text x="192" y="482" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">ConfigMap · Secret 設定物件</text>
    <text x="104" y="544" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">.env 的 k8s 形態：非敏感進 ConfigMap、密碼進 Secret；</text>
    <text x="104" y="574" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Secret 是 base64 編碼不是加密，一樣不能進 git。</text>
  </g>

  <g filter="url(#u12-term-shadow)">
    <rect x="612" y="404" width="516" height="220" rx="24" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="644" y="440" width="64" height="64" rx="18" fill="#ecfdf5"/>
    <text x="656" y="484" fill="#16a34a" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">R</text>
    <text x="732" y="482" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Rolling Update 滾動更新</text>
    <text x="644" y="544" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">逐副本換版：新 Pod 起來且健康檢查通過，才殺舊 Pod，</text>
    <text x="644" y="574" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">服務全程不斷線；出問題 rollout undo 一行退版。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u12-diagram-title u12-diagram-desc">
  <title id="u12-diagram-title">Unit 12｜宣告式收斂與自癒流程</title>
  <desc id="u12-diagram-desc">宣告期望狀態、k8s 比對現實、落差自動修正：自癒與滾動更新。</desc>
  <defs>
    <linearGradient id="u12-diagram-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="u12-diagram-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="u12-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#7c3aed"/>
    </marker>
    <marker id="u12-arrow-loop" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u12-diagram-bg)"/>
  <text x="56" y="70" fill="#0f172a" font-size="32" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">宣告式收斂與自癒流程</text>
  <text x="58" y="106" fill="#475569" font-size="17" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">你不下「啟動容器」的命令——你宣告期望，k8s 持續把現實修成宣告的樣子</text>

  <!-- 步驟一：宣告期望 -->
  <g filter="url(#u12-diagram-shadow)">
    <rect x="72" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#ddd6fe"/>
    <rect x="72" y="200" width="300" height="52" rx="24" fill="#7c3aed"/>
    <text x="100" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">① 宣告期望狀態</text>
    <rect x="100" y="276" width="244" height="44" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="118" y="304" fill="#7c3aed" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">replicas: 2 · image 1.0.0</text>
    <rect x="100" y="332" width="244" height="44" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="118" y="360" fill="#d97706" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">envFrom ConfigMap/Secret</text>
    <rect x="100" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="118" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">kubectl apply -f k8s/</text>
  </g>

  <!-- 步驟二：比對現實 -->
  <g filter="url(#u12-diagram-shadow)">
    <rect x="452" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="452" y="200" width="300" height="52" rx="24" fill="#2563eb"/>
    <text x="480" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">② 持續比對現實</text>
    <rect x="480" y="276" width="244" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="498" y="304" fill="#2563eb" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">現實：pod ×2？版本對？</text>
    <rect x="480" y="332" width="244" height="44" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="498" y="360" fill="#e11d48" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">pod 被刪 → 現實只剩 1 個</text>
    <rect x="480" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="498" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">機器掛了、假死也算落差</text>
  </g>

  <!-- 步驟三：自動修正 -->
  <g filter="url(#u12-diagram-shadow)">
    <rect x="832" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="832" y="200" width="300" height="52" rx="24" fill="#16a34a"/>
    <text x="860" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">③ 落差自動修正</text>
    <rect x="860" y="276" width="244" height="44" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="878" y="304" fill="#16a34a" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">自癒：秒級補齊副本</text>
    <rect x="860" y="332" width="244" height="44" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="878" y="360" fill="#7c3aed" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">滾動更新：逐副本換版</text>
    <rect x="860" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="878" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">rollout undo 一行退版</text>
  </g>

  <!-- 流程箭頭與收斂迴圈 -->
  <path d="M372 320 C404 320 420 320 448 320" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" marker-end="url(#u12-arrow)"/>
  <path d="M752 320 C784 320 800 320 828 320" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" marker-end="url(#u12-arrow)"/>
  <path d="M980 444 C980 492 640 492 604 448" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#u12-arrow-loop)"/>
  <text x="700" y="508" fill="#16a34a" font-size="14" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">收斂迴圈：修正後回到比對，永不停止</text>

  <!-- 底部對照 chips -->
  <g transform="translate(88,540)">
    <rect width="480" height="96" rx="20" fill="#ffffff" stroke="#fecaca"/>
    <text x="28" y="40" fill="#e11d48" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">compose（命令式）</text>
    <text x="28" y="72" fill="#64748b" font-size="15" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">掛了要人工重啟 · 換版停舊起新有斷線 · 一台機器一份檔</text>
  </g>
  <g transform="translate(632,540)">
    <rect width="480" height="96" rx="20" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="28" y="40" fill="#16a34a" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">k8s（宣告式）</text>
    <text x="28" y="72" fill="#64748b" font-size="15" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">自癒補副本 · 滾動更新不斷線 · N 台機器一個資源池</text>
  </g>
</svg>

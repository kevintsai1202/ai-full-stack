<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u10-diagram-title u10-diagram-desc">
  <title id="u10-diagram-title">Unit 10｜多階段建置與層快取流程</title>
  <desc id="u10-diagram-desc">依賴層命中快取、原始碼層重建、產出精簡映像並打上版本 tag。</desc>
  <defs>
    <linearGradient id="u10-diagram-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="u10-diagram-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="u10-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u10-diagram-bg)"/>
  <text x="56" y="70" fill="#0f172a" font-size="32" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">多階段建置與層快取流程</text>
  <text x="58" y="106" fill="#475569" font-size="17" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Dockerfile 指令順序就是快取策略：少變動的放前面、常變動的放後面</text>

  <!-- 步驟一：依賴層 -->
  <g filter="url(#u10-diagram-shadow)">
    <rect x="72" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="72" y="200" width="300" height="52" rx="24" fill="#2563eb"/>
    <text x="100" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">① 依賴層（快取層）</text>
    <rect x="100" y="276" width="244" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="118" y="304" fill="#2563eb" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">COPY pom.xml → 下載依賴</text>
    <rect x="100" y="332" width="244" height="44" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="118" y="360" fill="#16a34a" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">pom 沒變 → CACHED</text>
    <rect x="100" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="118" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">重建時間：分鐘 → 秒</text>
  </g>

  <!-- 步驟二：原始碼層 -->
  <g filter="url(#u10-diagram-shadow)">
    <rect x="452" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="452" y="200" width="300" height="52" rx="24" fill="#16a34a"/>
    <text x="480" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">② 原始碼層（重建層）</text>
    <rect x="480" y="276" width="244" height="44" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="498" y="304" fill="#16a34a" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">COPY src → mvn package</text>
    <rect x="480" y="332" width="244" height="44" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="498" y="360" fill="#d97706" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">改程式碼只重跑這層之後</text>
    <rect x="480" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="498" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">base image 明確寫 JDK 21</text>
  </g>

  <!-- 步驟三：精簡映像 -->
  <g filter="url(#u10-diagram-shadow)">
    <rect x="832" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="832" y="200" width="300" height="52" rx="24" fill="#d97706"/>
    <text x="860" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">③ 精簡映像＋版本 tag</text>
    <rect x="860" y="276" width="244" height="44" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="878" y="304" fill="#d97706" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">JRE 映像只帶 jar</text>
    <rect x="860" y="332" width="244" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="878" y="360" fill="#2563eb" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">tag 1.0.0 / git SHA</text>
    <rect x="860" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="878" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">docker history 檢查分層</text>
  </g>

  <!-- 流程箭頭 -->
  <path d="M372 320 C404 320 420 320 448 320" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#u10-arrow)"/>
  <path d="M752 320 C784 320 800 320 828 320" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#u10-arrow)"/>

  <!-- 底部對照 chips -->
  <g transform="translate(88,520)">
    <rect width="480" height="96" rx="20" fill="#ffffff" stroke="#fecaca"/>
    <text x="28" y="40" fill="#e11d48" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">交付原始碼</text>
    <text x="28" y="72" fill="#64748b" font-size="15" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">對方要裝 JDK/Node · 版本錯就跑不起來 · 「在我電腦上可以跑」</text>
  </g>
  <g transform="translate(632,520)">
    <rect width="480" height="96" rx="20" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="28" y="40" fill="#16a34a" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">交付映像</text>
    <text x="28" y="72" fill="#64748b" font-size="15" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">環境自帶 · 任何機器行為一致 · k8s 只認映像不認原始碼</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u10-hero-title u10-hero-desc">
  <title id="u10-hero-title">Unit 10｜Docker 映像打包</title>
  <desc id="u10-hero-desc">多階段建置：原始碼進、有版本號映像出</desc>
  <defs>
    <linearGradient id="u10-hero-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="52%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="u10-hero-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="u10-hero-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u10-hero-bg)"/>
  <path d="M0 126 C220 40 335 120 520 62 C715 0 835 82 1200 26 L1200 0 L0 0 Z" fill="#2563eb" opacity="0.1"/>
  <circle cx="1030" cy="108" r="116" fill="#2563eb" opacity="0.09"/>
  <circle cx="112" cy="572" r="92" fill="#16a34a" opacity="0.08"/>
  <text x="56" y="70" fill="#0f172a" font-size="34" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Unit 10｜Docker 映像打包</text>
  <text x="58" y="108" fill="#475569" font-size="18" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">從「能跑」到「能交付」：環境自帶・快取友善・版本可考</text>

  <!-- 建置階段：原始碼 + 建置工具 -->
  <g filter="url(#u10-hero-shadow)">
    <rect x="64" y="168" width="420" height="330" rx="28" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="64" y="168" width="420" height="60" rx="28" fill="#0f172a"/>
    <circle cx="106" cy="198" r="8" fill="#ef4444"/>
    <circle cx="130" cy="198" r="8" fill="#f59e0b"/>
    <circle cx="154" cy="198" r="8" fill="#22c55e"/>
    <text x="184" y="206" fill="#e2e8f0" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">建置階段 · docker build</text>
    <rect x="96" y="252" width="356" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="116" y="286" fill="#2563eb" font-size="16" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">依賴層：pom.xml · 命中快取</text>
    <rect x="96" y="328" width="356" height="56" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="116" y="362" fill="#16a34a" font-size="16" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">原始碼層：src · 只重建這層</text>
    <rect x="96" y="404" width="356" height="56" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="116" y="438" fill="#d97706" font-size="16" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">.dockerignore：擋掉 target/.git/.env</text>
  </g>

  <!-- 產出箭頭 -->
  <path d="M492 332 C560 332 560 332 626 332" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#u10-hero-arrow)"/>
  <text x="506" y="308" fill="#2563eb" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">建置工具不進最終映像</text>

  <!-- 交付物：有版本號的精簡映像 -->
  <g filter="url(#u10-hero-shadow)">
    <rect x="648" y="200" width="488" height="270" rx="28" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="648" y="200" width="488" height="60" rx="28" fill="#2563eb"/>
    <text x="680" y="238" fill="#ffffff" font-size="18" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">交付物：精簡執行映像</text>
    <rect x="684" y="288" width="200" height="64" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="704" y="315" fill="#2563eb" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">backend:1.0.0</text>
    <text x="704" y="340" fill="#64748b" font-size="13" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">JRE 21 + jar · &lt;400MB</text>
    <rect x="908" y="288" width="200" height="64" rx="16" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="928" y="315" fill="#16a34a" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">frontend:1.0.0</text>
    <text x="928" y="340" fill="#64748b" font-size="13" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">nginx + dist · 反代 /api</text>
    <rect x="684" y="376" width="424" height="60" rx="16" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="704" y="404" fill="#475569" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">明確版本 tag：latest 是浮動標籤</text>
    <text x="704" y="426" fill="#64748b" font-size="13" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">舊 tag 留在機器上，是下一單元退版的保險</text>
  </g>

  <!-- 底部流程 chips -->
  <g transform="translate(88,548)">
    <rect width="230" height="54" rx="27" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="30" cy="27" r="10" fill="#2563eb"/>
    <text x="52" y="34" fill="#0f172a" font-size="17" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">多階段建置</text>
  </g>
  <g transform="translate(358,548)">
    <rect width="230" height="54" rx="27" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <circle cx="30" cy="27" r="10" fill="#0891b2"/>
    <text x="52" y="34" fill="#0f172a" font-size="17" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">快取與體檢</text>
  </g>
  <g transform="translate(628,548)">
    <rect width="230" height="54" rx="27" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <circle cx="30" cy="27" r="10" fill="#d97706"/>
    <text x="52" y="34" fill="#0f172a" font-size="17" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">版本 tag</text>
  </g>
  <g transform="translate(898,548)">
    <rect width="230" height="54" rx="27" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="30" cy="27" r="10" fill="#16a34a"/>
    <text x="52" y="34" fill="#0f172a" font-size="17" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">compose 驗證</text>
  </g>
</svg>

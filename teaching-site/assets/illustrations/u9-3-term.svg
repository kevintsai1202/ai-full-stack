<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u9-term-title u9-term-desc">
  <title id="u9-term-title">Unit 9｜專業術語解釋</title>
  <desc id="u9-term-desc">把抽象名詞變成可快速複習的概念圖卡。</desc>
  <defs>

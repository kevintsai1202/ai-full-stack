  <rect width="1200" height="675" rx="36" fill="url(#u9-term-bg)"/>
  <circle cx="1060" cy="96" r="96" fill="#d97706" opacity="0.08"/>
  <text x="56" y="70" fill="#0f172a" font-size="32" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Unit 9｜專業術語解釋</text>
  <text x="58" y="106" fill="#475569" font-size="17" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Cloudflare Tunnel 上線實戰的四個核心名詞</text>

  <g filter="url(#u9-term-shadow)">
    <rect x="72" y="152" width="516" height="220" rx="24" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="104" y="188" width="64" height="64" rx="18" fill="#fff7ed"/>
    <text x="122" y="232" fill="#d97706" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">R</text>
    <text x="192" y="230" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Reverse Tunnel 反向隧道</text>
    <text x="104" y="292" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">連線由內網主動向外建立，外部流量沿隧道反向送回；</text>
    <text x="104" y="322" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">防火牆不需要任何入站規則，沒有公網 IP 也能對外服務。</text>
  </g>

  <g filter="url(#u9-term-shadow)">
    <rect x="612" y="152" width="516" height="220" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="644" y="188" width="64" height="64" rx="18" fill="#eff6ff"/>
    <text x="662" y="232" fill="#2563eb" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Q</text>
    <text x="732" y="230" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Quick Tunnel 快速通道</text>
    <text x="644" y="292" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">免帳號、免網域，一行指令取得 *.trycloudflare.com</text>
    <text x="644" y="322" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">隨機網址；適合 demo 與測試，重啟後網址會更換。</text>
  </g>

  <g filter="url(#u9-term-shadow)">
    <rect x="72" y="404" width="516" height="220" rx="24" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="104" y="440" width="64" height="64" rx="18" fill="#ecfdf5"/>
    <text x="118" y="484" fill="#16a34a" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">N</text>
    <text x="192" y="482" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Named Tunnel 具名通道</text>
    <text x="104" y="544" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">綁定自有網域的正式通道：固定網址、自動 HTTPS，</text>
    <text x="104" y="574" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">前提是網域掛在 Cloudflare DNS（免費方案即可）。</text>

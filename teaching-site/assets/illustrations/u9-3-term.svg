    <text x="658" y="484" fill="#7c3aed" font-size="30" font-weight="900" font-family="system-ui, 'Microsoft JhengHei', sans-serif">M</text>
    <text x="732" y="482" fill="#0f172a" font-size="23" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Multi-stage Build 多階段建置</text>
    <text x="644" y="544" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">建置工具留在建置階段，最終映像只帶執行環境；</text>
    <text x="644" y="574" fill="#475569" font-size="16" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Spring Boot 映像從 800MB+ 瘦身到 300MB 以下。</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="u9-diagram-title u9-diagram-desc">
  <title id="u9-diagram-title">Unit 9｜Tunnel 反向連線流程</title>
  <desc id="u9-diagram-desc">內網機器主動向外建立連線，外部流量沿隧道反向送回，防火牆不開任何入站 port。</desc>
  <defs>
    <linearGradient id="u9-diagram-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="u9-diagram-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="u9-arrow-out" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#d97706"/>
    </marker>
    <marker id="u9-arrow-in" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#u9-diagram-bg)"/>
  <text x="56" y="70" fill="#0f172a" font-size="32" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Tunnel 反向連線流程</text>
  <text x="58" y="106" fill="#475569" font-size="17" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">連線由內往外建立（打洞），外部請求沿著同一條隧道反向送回——防火牆零入站規則</text>

  <!-- 步驟一：內網機器 -->
  <g filter="url(#u9-diagram-shadow)">
    <rect x="72" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="72" y="200" width="300" height="52" rx="24" fill="#0f172a"/>
    <text x="100" y="234" fill="#e2e8f0" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">① 內網機器（無公網 IP）</text>
    <rect x="100" y="276" width="244" height="44" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="118" y="304" fill="#d97706" font-size="15" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">cloudflared 主動向外連線</text>
    <rect x="100" y="332" width="244" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="118" y="360" fill="#2563eb" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">nginx → /api → Spring Boot</text>
    <rect x="100" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="118" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">防火牆：入站 port 全關</text>
  </g>

  <!-- 步驟二：Cloudflare 邊緣 -->
  <g filter="url(#u9-diagram-shadow)">
    <rect x="452" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="452" y="200" width="300" height="52" rx="24" fill="#f6821f"/>
    <text x="480" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">② Cloudflare 邊緣節點</text>
    <rect x="480" y="276" width="244" height="44" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="498" y="304" fill="#d97706" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">維持加密持久隧道</text>
    <rect x="480" y="332" width="244" height="44" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="498" y="360" fill="#475569" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">HTTPS 憑證 · DDoS 防護</text>
    <rect x="480" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="498" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">隱藏來源 IP</text>
  </g>

  <!-- 步驟三：外部使用者 -->
  <g filter="url(#u9-diagram-shadow)">
    <rect x="832" y="200" width="300" height="240" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="832" y="200" width="300" height="52" rx="24" fill="#2563eb"/>
    <text x="860" y="234" fill="#ffffff" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">③ 外部使用者</text>
    <rect x="860" y="276" width="244" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="878" y="304" fill="#2563eb" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">*.trycloudflare.com（demo）</text>
    <rect x="860" y="332" width="244" height="44" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="878" y="360" fill="#16a34a" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">crm.你的網域.com（正式）</text>
    <rect x="860" y="388" width="244" height="36" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
    <text x="878" y="412" fill="#64748b" font-size="14" font-weight="700" font-family="system-ui, 'Microsoft JhengHei', sans-serif">手機 4G 直接連入</text>
  </g>

  <!-- 連線箭頭：出站（橘、虛線）與請求回送（藍） -->
  <path d="M372 288 C404 288 420 288 448 288" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14" marker-end="url(#u9-arrow-out)"/>
  <text x="376" y="270" fill="#d97706" font-size="14" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">出站打洞</text>
  <path d="M828 356 C796 356 780 356 756 356" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#u9-arrow-in)"/>
  <path d="M448 372 C420 372 404 372 376 372" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#u9-arrow-in)"/>
  <text x="762" y="338" fill="#2563eb" font-size="14" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">請求反向送回</text>

  <!-- 底部對照 chips -->
  <g transform="translate(88,520)">
    <rect width="480" height="96" rx="20" fill="#ffffff" stroke="#fecaca"/>
    <text x="28" y="40" fill="#e11d48" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">傳統 port forwarding</text>
    <text x="28" y="72" fill="#64748b" font-size="15" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">要公網 IP／DDNS · 防火牆開洞 · 暴露來源 IP</text>
  </g>
  <g transform="translate(632,520)">
    <rect width="480" height="96" rx="20" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="28" y="40" fill="#16a34a" font-size="17" font-weight="800" font-family="system-ui, 'Microsoft JhengHei', sans-serif">Cloudflare Tunnel</text>
    <text x="28" y="72" fill="#64748b" font-size="15" font-weight="600" font-family="system-ui, 'Microsoft JhengHei', sans-serif">免公網 IP · 零入站規則 · CGNAT 也能用</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="562" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">TUNNEL 系列全景總結：從內網穿透到零信任防禦</text><text x="500" y="75" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">四期連貫架構——打造現代工程師隨時隨地安全發布本地服務的完整能力</text><rect x="40" y="110" width="215" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="147.5" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="147" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">T0 原理篇 (017)</text><text x="147" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">從 WebRTC 到反向通道</text><line x1="60" y1="195" x2="235" y2="195" stroke="#e2e8f0" stroke-width="1.2"/><text x="58" y="225" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 防火牆只擋 Inbound 入站</text><text x="58" y="267" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 主動向 Edge 建立出站連線</text><text x="58" y="309" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 免開 Port、免固定 IP</text><text x="58" y="351" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 告別老派危險 Port Forwarding</text><rect x="275" y="110" width="215" height="360" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="382.5" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="382" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">T1 實戰篇 (018)</text><text x="382" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">同站路由與 CORS 消除</text><line x1="295" y1="195" x2="470" y2="195" stroke="#0f766e" stroke-width="1.2"/><text x="293" y="225" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 一份 config.yml Ingress 規則</text><text x="293" y="267" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• /api 導後端，其餘導前端</text><text x="293" y="309" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 完全同源，消滅 OPTIONS 預檢</text><text x="293" y="351" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 4 條 QUIC 平行多工傳輸</text><rect x="510" y="110" width="215" height="360" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="617.5" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="617" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">T2 除錯篇 (019)</text><text x="617" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">本機攔截真實 Webhook</text><line x1="530" y1="195" x2="705" y2="195" stroke="#1d4ed8" stroke-width="1.2"/><text x="528" y="225" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 告別 Mock，IDE 設斷點攔截</text><text x="528" y="267" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 解決 InputStream 串流枯竭</text><text x="528" y="309" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• HMAC-SHA256 常數時間驗簽</text><text x="528" y="351" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 50ms 秒回 200 + 異步解耦</text><rect x="745" y="110" width="215" height="360" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="852.5" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="852" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">T3 防護篇 (020)</text><text x="852" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Zero Trust 零信任防衛</text><line x1="765" y1="195" x2="940" y2="195" stroke="#d97706" stroke-width="1.2"/><text x="763" y="225" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• 邊緣攔截，防禦 AI Token 帳單</text><text x="763" y="267" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• Google SSO / Email OTP 白名單</text><text x="763" y="309" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• Webhook Bypass 專用放行</text><text x="763" y="351" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• RS256 離線驗證 JWT 信任鏈</text><text x="500" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">從單機孤島、真實回調到企業級零信任閉環——用現代雲端邊緣網路武裝你的全端開發流！</text><text x="500" y="535" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">《AI 賦能全端開發：從零打造企業級智慧應用》課程加碼單元・完整實踐</text></svg>
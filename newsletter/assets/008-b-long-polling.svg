<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="400" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">長輪詢（Long Polling）：掛著等，有事才回</text><rect x="60" y="90" width="130" height="260" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="125.0" y="226.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">瀏覽器</text><rect x="810" y="90" width="130" height="260" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="875.0" y="226.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">伺服器</text><defs><marker id="m28889" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker></defs><line x1="190" y1="130" x2="810" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#m28889)"/><text x="500.0" y="122.0" text-anchor="middle" font-size="14" fill="#64748b" font-weight="600">① 請求發出</text><rect x="480" y="150" width="180" height="34" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="570" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#d97706">② 伺服器先不回，掛著等…</text><defs><marker id="m4914" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="810" y1="215" x2="190" y2="215" stroke="#0f766e" stroke-width="2.2" marker-end="url(#m4914)"/><text x="500.0" y="207.0" text-anchor="middle" font-size="14" fill="#0f766e" font-weight="600">③ 有新資料（或超時）才回應</text><defs><marker id="m39461" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker></defs><line x1="190" y1="265" x2="810" y2="265" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#m39461)"/><text x="500.0" y="257.0" text-anchor="middle" font-size="14" fill="#64748b" font-weight="600">④ 收到後立刻再發下一輪</text><text x="500" y="320" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">循環結果：永遠有一個請求在伺服器待命——延遲接近即時</text><text x="500" y="344" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">伺服器端切記用 DeferredResult 之類的非同步等待，別佔住執行緒</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="400" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">一個任務的一生：只進不退</text><rect x="70" y="150" width="150" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="145.0" y="183.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">PENDING</text><text x="145" y="224" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">已登記，還沒開始</text><defs><marker id="m81447" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="222" y1="177" x2="276" y2="177" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#m81447)"/><rect x="286" y="150" width="150" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="361.0" y="183.0" text-anchor="middle" font-size="16" font-weight="700" fill="#d97706">RUNNING</text><text x="361" y="224" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">正在呼叫 LLM</text><defs><marker id="m49394" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="438" y1="168" x2="496" y2="134" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#m49394)"/><rect x="506" y="106" width="150" height="54" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="581.0" y="139.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">DONE</text><text x="581" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">✗ 不可退回 RUNNING</text><defs><marker id="m69093" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="438" y1="190" x2="496" y2="226" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#m69093)"/><rect x="506" y="202" width="150" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="581.0" y="235.0" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">FAILED</text><text x="581" y="276" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">重試到上限，放棄</text><defs><marker id="m406" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="658" y1="229" x2="706" y2="229" stroke="#dc2626" stroke-width="2.2" marker-end="url(#m406)"/><rect x="716" y="202" width="190" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="811.0" y="235.0" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">死信表</text><text x="811" y="276" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">查得到、可人工重跑</text><text x="500" y="340" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">update … where status = 'PENDING' —— 更新到 0 筆就代表輪不到你，直接跳過</text><text x="500" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">只進不退，擋掉「重送的舊事件蓋掉新結果」這種極難查的問題</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="430" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">退避要愈退愈慢——除非它溢位了</text><text x="500" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">正確版：夾住指數再位移</text><rect x="150" y="216.4" width="58" height="15.6" rx="6" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="179" y="206.4" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">1s</text><text x="179" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">第 1 次</text><rect x="230" y="212.8" width="58" height="19.2" rx="6" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="259" y="202.8" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">2s</text><text x="259" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">第 2 次</text><rect x="310" y="205.6" width="58" height="26.4" rx="6" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="339" y="195.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">4s</text><text x="339" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">第 3 次</text><rect x="390" y="191.2" width="58" height="40.8" rx="6" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="419" y="181.2" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">8s</text><text x="419" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">第 4 次</text><rect x="470" y="162.4" width="58" height="69.6" rx="6" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="499" y="152.4" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">16s</text><text x="499" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">第 5 次</text><rect x="550" y="112.0" width="58" height="120.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="579" y="102.0" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">30s</text><text x="579" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">第 6 次</text><rect x="630" y="112.0" width="58" height="120.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="659" y="102.0" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">30s</text><text x="659" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">第 7 次</text><rect x="710" y="112.0" width="58" height="120.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="739" y="102.0" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">30s</text><text x="739" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">第 8 次</text><text x="500" y="276" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">第 6 次之後碰到 30 秒上限，維持不變</text><line x1="40" y1="300" x2="960" y2="300" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,6"/><text x="500" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">反例：沒夾住指數，attempts 一路累加下去</text><rect x="180" y="344" width="300" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="330.0" y="373.0" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">attempt = 55 → 退避 −4.3×10¹⁷ 毫秒</text><rect x="520" y="344" width="300" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="670.0" y="373.0" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">attempt = 64 → 退避 0 毫秒</text><text x="500" y="414" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">負的或零的退避，效果一樣：完全不等，變成對著故障下游的重試風暴</text></svg>
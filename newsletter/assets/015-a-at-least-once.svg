<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="390" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">為什麼事件一定會重送</text><text x="500" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">排程送出事件的三個步驟</text><rect x="110" y="104" width="180" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="200.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">① 撈出未送出的</text><defs><marker id="m19349" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="292" y1="129" x2="326" y2="129" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m19349)"/><rect x="336" y="104" width="160" height="50" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="416.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">② 送出去</text><defs><marker id="m3362" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="498" y1="129" x2="532" y2="129" stroke="#dc2626" stroke-width="2.0" marker-end="url(#m3362)"/><rect x="542" y="104" width="140" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="612.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">當機</text><rect x="722" y="104" width="180" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="812.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#c2cad8">③ 標記已送出</text><text x="812" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">這一步沒跑到</text><text x="612" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">在 ② 和 ③ 之間當機</text><line x1="40" y1="206" x2="960" y2="206" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,6"/><text x="500" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">重開之後：資料庫還記著「這筆沒送」</text><rect x="110" y="258" width="180" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="200.0" y="289.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">① 又撈到同一筆</text><defs><marker id="m81064" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="292" y1="283" x2="326" y2="283" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m81064)"/><rect x="336" y="258" width="160" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="416.0" y="289.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">② 再送一次</text><text x="520" y="289" text-anchor="start" font-size="14" font-weight="600" fill="#d97706">→ 下游收到第二次：同一個事件、兩次處理</text><text x="500" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">這就是「至少一次送達」——去重是接收端的責任，不是送出端的</text></svg>
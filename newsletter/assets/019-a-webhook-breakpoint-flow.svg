<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="562" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">真實 Webhook 本地斷點除錯與秒級解耦架構</text><text x="500" y="75" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">告別 Mock，讓 Stripe / LINE / GitHub 的真實事件直接打進本地 IDE</text><rect x="40" y="110" width="170" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="125.0" y="286.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">外部平台</text><text x="125.0" y="308.0" text-anchor="middle" font-size="13" fill="#64748b">Stripe / LINE / GitHub</text><text x="125" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">發送 Webhook</text><text x="125" y="235" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Header: 簽章</text><text x="125" y="255" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Body: JSON Payload</text><rect x="55" y="300" width="140" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="125.0" y="341.0" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">⚡ 超時限制
通常僅 5 秒！</text><text x="125" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">超時即發動重試風暴</text><rect x="260" y="105" width="430" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="475.0" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="475" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">本地 Spring Boot Webhook Controller</text><rect x="280" y="160" width="390" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="475.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">① IDE 中斷點（Breakpoint）攔截</text><text x="475.0" y="208.0" text-anchor="middle" font-size="13" fill="#64748b">查看真實複雜 JSON 結構與 Metadata</text><rect x="280" y="230" width="390" height="60" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="475.0" y="256.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">② HMAC-SHA256 驗簽比對</text><text x="475.0" y="278.0" text-anchor="middle" font-size="13" fill="#64748b">使用原始 Raw Bytes 運算，防篡改</text><rect x="280" y="300" width="390" height="60" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="475.0" y="326.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">③ 50ms 內立即回傳 200 OK</text><text x="475.0" y="348.0" text-anchor="middle" font-size="13" fill="#64748b">通知第三方「已安全收單」，終止重試</text><rect x="280" y="370" width="390" height="85" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="475.0" y="408.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">④ publishEvent(PaymentCompletedEvent)</text><text x="475.0" y="430.5" text-anchor="middle" font-size="13" fill="#64748b">拋入 Spring 事件總線，解耦業務邏輯</text><rect x="740" y="105" width="220" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="850.0" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="850" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">非同步背景執行緒池</text><rect x="760" y="175" width="180" height="80" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="850.0" y="211.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">@Async
監聽處理</text><text x="850.0" y="233.0" text-anchor="middle" font-size="13" fill="#64748b">異步重度任務</text><text x="850" y="285" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">• 寫入 DB 資料庫</text><text x="850" y="315" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">• 呼叫 LLM 生成摘要</text><text x="850" y="345" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">• 發送 Email / LINE</text><text x="850" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">• 015 冪等表去重</text><defs><marker id="m7351" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="210" y1="230" x2="260" y2="230" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m7351)"/><text x="235.0" y="222.0" text-anchor="middle" font-size="14" fill="#0f766e" font-weight="600">Tunnel 穿透</text><defs><marker id="m39325" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="670" y1="410" x2="760" y2="215" stroke="#0f766e" stroke-width="2.2" marker-end="url(#m39325)"/><text x="715.0" y="304.5" text-anchor="middle" font-size="14" fill="#0f766e" font-weight="600">內部事件解耦</text><defs><marker id="m49098" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8"/></marker></defs><line x1="280" y1="330" x2="210" y2="330" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#m49098)"/><text x="245.0" y="322.0" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="600">200 OK (50ms)</text><text x="500" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">✓ 接收端黃金法則：驗簽通過立刻秒回 200 OK，不要在 Webhook Thread 裡面執行耗時的業務邏輯</text><text x="500" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">✓ 結合 015 冪等鍵（Idempotency Key）：即便本地斷點超時引發第三方重試，後端也能天然安全去重</text></svg>
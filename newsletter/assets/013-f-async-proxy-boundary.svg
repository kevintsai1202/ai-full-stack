<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="500" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">@Async 的正確邊界：外部呼叫要先經過 proxy</text><text x="500" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">正確路徑：外部呼叫 → Spring proxy → 有界執行器 → 背景工作</text><rect x="40" y="108" width="150" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="115.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">外部呼叫</text><text x="115.0" y="158.0" text-anchor="middle" font-size="13" fill="#64748b">Controller／事件</text><defs><marker id="m83737" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="190" y1="140" x2="222" y2="140" stroke="#0f766e" stroke-width="2.4" marker-end="url(#m83737)"/><rect x="230" y="108" width="150" height="64" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="305.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Spring proxy</text><text x="305.0" y="158.0" text-anchor="middle" font-size="13" fill="#64748b">@Async 攔截</text><defs><marker id="m72628" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="380" y1="140" x2="412" y2="140" stroke="#0f766e" stroke-width="2.4" marker-end="url(#m72628)"/><rect x="420" y="108" width="150" height="64" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="495.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">taskExecutor</text><text x="495.0" y="158.0" text-anchor="middle" font-size="13" fill="#64748b">core=2／queue=50</text><defs><marker id="m4147" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="570" y1="140" x2="602" y2="140" stroke="#0f766e" stroke-width="2.4" marker-end="url(#m4147)"/><rect x="610" y="108" width="150" height="64" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="685.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">背景 worker</text><text x="685.0" y="158.0" text-anchor="middle" font-size="13" fill="#64748b">另一條執行緒</text><defs><marker id="m26631" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="760" y1="140" x2="792" y2="140" stroke="#0f766e" stroke-width="2.4" marker-end="url(#m26631)"/><rect x="800" y="108" width="160" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="880.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">LLM 摘要</text><text x="880.0" y="158.0" text-anchor="middle" font-size="13" fill="#64748b">慢，但不堵住使用者</text><rect x="40" y="250" width="260" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="170.0" y="331.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="170" y="283" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">this.generate()</text><text x="170" y="318" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">繞過 proxy</text><text x="170" y="340" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">仍在 main</text><text x="170" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">→ @Async 等於沒加</text><rect x="370" y="250" width="260" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="500.0" y="331.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="500" y="283" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">void 拋例外</text><text x="500" y="318" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">呼叫端早已返回</text><text x="500" y="340" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">只剩 log 可見</text><text x="500" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">→ 應寫回 FAILED</text><rect x="700" y="250" width="260" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="830.0" y="331.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="830" y="283" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">沒有 taskExecutor</text><text x="830" y="318" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">退回 SimpleAsyncTaskExecutor</text><text x="830" y="340" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">每次開新執行緒</text><text x="830" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">→ 不重用、沒上限</text><text x="500" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">三個旁路不一定讓程式啟動失敗，卻會讓執行方式偏離你的設計</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="396" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">同一張表，三個答案</text><rect x="380" y="84" width="240" height="56" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="118.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">agent_steps 軌跡表</text><defs><marker id="m75617" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="500" y1="146" x2="170" y2="186" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m75617)"/><rect x="50" y="190" width="240" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="170.0" y="252.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="170" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">回放</text><text x="170" y="254" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">order by step_no</text><text x="170" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">它讀了什麼？</text><defs><marker id="m60930" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="500" y1="146" x2="500" y2="186" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m60930)"/><rect x="380" y="190" width="240" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="500.0" y="252.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="500" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">成本歸屬</text><text x="500" y="254" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">sum(tokens)</text><text x="500" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">這次花了多少？</text><defs><marker id="m18880" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="500" y1="146" x2="830" y2="186" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m18880)"/><rect x="710" y="190" width="240" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="830.0" y="252.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="830" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">稽核</text><text x="830" y="254" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">依 step_type 查</text><text x="830" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">這結論怎麼來的？</text><text x="500" y="334" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">只 insert、不 update——事實不會被改寫</text><text x="500" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">你要求 AI 交出可審查的產物——這是系統對自己提同一個要求</text></svg>
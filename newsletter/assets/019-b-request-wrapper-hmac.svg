<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="562" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">InputStream 串流不可逆性 vs HMAC 常數時間驗簽</text><text x="500" y="75" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">搞懂 Request Body 只能讀一次的底層限制，與防範時序攻擊的驗簽實踐</text><rect x="40" y="100" width="920" height="160" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="500.0" y="186.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="80" y="125" text-anchor="start" font-size="16" font-weight="700" fill="#dc2626">❌ 串流枯竭陷阱（ServletInputStream Stream Exhaustion）</text><rect x="70" y="145" width="230" height="95" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="185.0" y="188.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">HTTP Request Body
(TCP Socket Stream)</text><text x="185.0" y="210.5" text-anchor="middle" font-size="13" fill="#64748b">單向前進指針 (Cursor)</text><defs><marker id="m98755" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="300" y1="192" x2="380" y2="192" stroke="#dc2626" stroke-width="2.0" marker-end="url(#m98755)"/><text x="340.0" y="184.0" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="600">@RequestBody 讀取</text><rect x="380" y="145" width="260" height="95" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="510.0" y="188.5" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Spring HttpMessageConverter
(Jackson 反序列化)</text><text x="510.0" y="210.5" text-anchor="middle" font-size="13" fill="#64748b">消耗 Stream 轉為 DTO 物件
游標抵達 EOF</text><defs><marker id="m98157" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="640" y1="192" x2="720" y2="192" stroke="#dc2626" stroke-width="2.0" marker-end="url(#m98157)"/><text x="680.0" y="184.0" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="600">二次讀取</text><rect x="720" y="145" width="210" height="95" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="825.0" y="188.5" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">request.getInputStream()
讀取 Raw Bytes</text><text x="825.0" y="210.5" text-anchor="middle" font-size="13" fill="#64748b">❌ 游標在 EOF，回傳空值！
導致驗簽必定失敗</text><rect x="40" y="280" width="920" height="210" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="500.0" y="391.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="80" y="305" text-anchor="start" font-size="16" font-weight="700" fill="#0f766e">✓ 正確解法：提取 Raw Bytes ＋ HMAC-SHA256 常數時間比對</text><rect x="70" y="325" width="200" height="105" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="170.0" y="373.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">① 讀取原始 Bytes</text><text x="170.0" y="395.5" text-anchor="middle" font-size="13" fill="#64748b">request.getInputStream()
.readAllBytes()</text><defs><marker id="m9296" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="270" y1="377" x2="300" y2="377" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m9296)"/><rect x="300" y="325" width="200" height="105" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="400.0" y="373.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">② 本地重算 HMAC</text><text x="400.0" y="395.5" text-anchor="middle" font-size="13" fill="#64748b">HMAC_SHA256(rawBytes, secret)
運算出 localSignature</text><defs><marker id="m8085" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="500" y1="377" x2="530" y2="377" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m8085)"/><rect x="530" y="325" width="200" height="105" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="630.0" y="373.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">③ 常數時間比對</text><text x="630.0" y="395.5" text-anchor="middle" font-size="13" fill="#64748b">MessageDigest.isEqual()
(防 Timing Attack 時序攻擊)</text><defs><marker id="m53617" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="730" y1="377" x2="760" y2="377" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m53617)"/><rect x="760" y="325" width="200" height="105" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="860.0" y="373.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">④ 手動反序列化</text><text x="860.0" y="395.5" text-anchor="middle" font-size="13" fill="#64748b">objectMapper.readValue()
安全轉換為 Event DTO</text><text x="500" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">✓ 原始 bytes 未經任何 JSON 格式化更動，確保雜湊完全吻合；比對使用常數時間演算法防禦微秒時間差探測</text><text x="500" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">底層原則：HTTP Request Stream 是不可倒帶的（Non-rewindable），驗簽必須以最原始未解析的字節為準</text></svg>
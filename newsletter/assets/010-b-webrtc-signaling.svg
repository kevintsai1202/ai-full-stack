<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">WebRTC：連線前的三步曲</text><rect x="80" y="250" width="160" height="100" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="160.0" y="306.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">瀏覽器 A</text><rect x="760" y="250" width="160" height="100" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="840.0" y="306.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">瀏覽器 B</text><rect x="420" y="80" width="160" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="500.0" y="111.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">信令伺服器</text><text x="500.0" y="133.0" text-anchor="middle" font-size="13" fill="#64748b">通常用 WebSocket</text><rect x="240" y="80" width="130" height="70" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="305.0" y="111.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">STUN</text><text x="305.0" y="133.0" text-anchor="middle" font-size="13" fill="#64748b">發現公網位址</text><rect x="640" y="80" width="130" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="705.0" y="111.0" text-anchor="middle" font-size="17" font-weight="700" fill="#d97706">TURN</text><text x="705.0" y="133.0" text-anchor="middle" font-size="13" fill="#64748b">穿不透時中繼（花錢）</text><defs><marker id="m6607" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker></defs><line x1="200" y1="260" x2="430" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#m6607)"/><text x="315.0" y="197.0" text-anchor="middle" font-size="14" fill="#64748b" font-weight="600">① offer</text><defs><marker id="m81973" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker></defs><line x1="570" y1="150" x2="790" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#m81973)"/><defs><marker id="m53352" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker></defs><line x1="760" y1="280" x2="590" y2="155" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#m53352)"/><text x="675.0" y="209.5" text-anchor="middle" font-size="14" fill="#64748b" font-weight="600">② answer</text><defs><marker id="m38290" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker></defs><line x1="410" y1="155" x2="240" y2="280" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#m38290)"/><defs><marker id="m26904" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#d97706"/></marker></defs><line x1="240" y1="330" x2="760" y2="330" stroke="#d97706" stroke-width="3" marker-end="url(#m26904)"/><text x="500.0" y="322.0" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">③ ICE 候選位址互換 → 打通 P2P 通道（媒體不經你的伺服器）</text><text x="500" y="395" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">offer/answer 換能力・ICE 換路徑・STUN/TURN 幫穿牆</text><text x="500" y="420" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">「點對點」≠「不需要伺服器」——信令與 TURN 都是你要準備的</text></svg>
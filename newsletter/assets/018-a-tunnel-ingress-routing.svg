<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="562" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Cloudflare Tunnel Ingress：同站路由與 CORS 消除</text><text x="500" y="75" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">一份 config.yml，把前後端收攏進同一網域名稱 crm.yourdomain.com</text><rect x="40" y="110" width="160" height="360" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="120.0" y="286.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">瀏覽器使用者</text><text x="120.0" y="308.0" text-anchor="middle" font-size="13" fill="#64748b">Single Origin</text><text x="120" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">請求頁面</text><text x="120" y="240" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">https://crm.../</text><text x="120" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">呼叫 API</text><text x="120" y="340" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">fetch("/api/customers")</text><rect x="260" y="105" width="420" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="470.0" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="470" y="135" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">Cloudflare 雲端邊緣 (Anycast Edge)</text><text x="470" y="160" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">config.yml Ingress 規則由上而下比對 (First-match-wins)</text><rect x="280" y="185" width="380" height="75" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="470.0" y="218.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">規則 1: path: ^/api</text><text x="470.0" y="240.5" text-anchor="middle" font-size="13" fill="#64748b">命中！轉送至後端 Spring Boot</text><rect x="280" y="275" width="380" height="75" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="470.0" y="308.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">規則 2: hostname: crm.yourdomain.com</text><text x="470.0" y="330.5" text-anchor="middle" font-size="13" fill="#64748b">命中！轉送至前端 React Vite</text><rect x="280" y="365" width="380" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="470.0" y="391.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">規則 3: - service: http_status:404</text><text x="470.0" y="413.0" text-anchor="middle" font-size="13" fill="#64748b">未匹配之請求一律回傳 404 兜底</text><rect x="740" y="105" width="220" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="850.0" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="850" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">本地開發機 (Localhost)</text><rect x="760" y="175" width="180" height="110" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="850.0" y="226.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Spring Boot 後端</text><text x="850.0" y="248.0" text-anchor="middle" font-size="13" fill="#64748b">localhost:8080
處理 /api/* 與 SSE</text><rect x="760" y="310" width="180" height="110" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="850.0" y="361.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">React Vite 前端</text><text x="850.0" y="383.0" text-anchor="middle" font-size="13" fill="#64748b">localhost:5173
處理 SPA 頁面與靜態資源</text><defs><marker id="m79389" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8"/></marker></defs><line x1="200" y1="230" x2="260" y2="230" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#m79389)"/><text x="230.0" y="222.0" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="600">同站請求</text><defs><marker id="m92933" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="660" y1="220" x2="760" y2="220" stroke="#0f766e" stroke-width="2.2" marker-end="url(#m92933)"/><text x="710.0" y="212.0" text-anchor="middle" font-size="14" fill="#0f766e" font-weight="600">QUIC 轉發 :8080</text><defs><marker id="m41462" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8"/></marker></defs><line x1="660" y1="310" x2="760" y2="360" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#m41462)"/><text x="710.0" y="327.0" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="600">QUIC 轉發 :5173</text><text x="500" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">✓ 瀏覽器視角完全同源（Same-Origin）：永遠不發送 OPTIONS preflight 預檢請求，延遲省一半</text><text x="500" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">✓ 前端 API URL 寫相對路徑 /api 即可，彻底拔除 Spring Security 繁瑣脆弱的 CORS 配置</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="420" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">設計期：一句「幫我寫」拆成三段</text><text x="500" y="76" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">先把決定攤開，再讓程式碼承接已審查的假設</text><rect x="35" y="112" width="190" height="70" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="130.0" y="143.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">需求＋限制</text><text x="130.0" y="165.0" text-anchor="middle" font-size="13" fill="#64748b">環境／技能／時程</text><defs><marker id="m1310" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="225" y1="147" x2="277" y2="147" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#m1310)"/><rect x="285" y="112" width="190" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="143.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">① 選型分析</text><text x="380.0" y="165.0" text-anchor="middle" font-size="13" fill="#64748b">候選方案＋有效邊界</text><defs><marker id="m15869" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="475" y1="147" x2="527" y2="147" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#m15869)"/><rect x="535" y="112" width="190" height="70" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="630.0" y="143.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">② 開發計畫</text><text x="630.0" y="165.0" text-anchor="middle" font-size="13" fill="#64748b">模組／里程碑／驗收</text><defs><marker id="m86175" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="725" y1="147" x2="777" y2="147" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#m86175)"/><rect x="785" y="112" width="180" height="70" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="875.0" y="143.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">③ 第一階段實作</text><text x="875.0" y="165.0" text-anchor="middle" font-size="13" fill="#64748b">照計畫動手</text><rect x="180" y="238" width="640" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="500.0" y="270.0" text-anchor="middle" font-size="18" font-weight="700" fill="#d97706">先不要寫程式碼</text><text x="500" y="333" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">把假設先變成便宜的審查點：計畫改一行，程式碼改一天</text><text x="500" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">這一站的驗收標準，下一站會直接變成測試</text></svg>
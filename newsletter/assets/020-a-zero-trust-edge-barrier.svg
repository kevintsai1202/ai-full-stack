(濫用 API / 刷 Token)</text><text x="135.0" y="413.0" text-anchor="middle" font-size="13" fill="#64748b">未授權的外部連線</text><rect x="280" y="105" width="390" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="475.0" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="475" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">Cloudflare Anycast 邊緣 (Access 防線)</text><rect x="300" y="155" width="350" height="75" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="475.0" y="188.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Application A：crm.yourdomain.com</text><text x="475.0" y="210.5" text-anchor="middle" font-size="13" fill="#64748b">Allow 政策：檢查 Cookie ➔ 302 Google SSO / OTP
驗證通過發放 JWT 並注入 Header</text><rect x="300" y="250" width="350" height="75" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="475.0" y="283.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Application B：/api/webhook/*</text><text x="475.0" y="305.5" text-anchor="middle" font-size="13" fill="#64748b">另建含 path 的應用並掛 Bypass 政策放行
（不驗證身分，改由後端 HMAC 簽章守護）</text><rect x="300" y="355" width="350" height="75" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="475.0" y="388.5" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">未命中 Allow：邊緣阻擋</text><text x="475.0" y="410.5" text-anchor="middle" font-size="13" fill="#64748b">未登入且非 Bypass 路徑之請求
邊緣直接回傳 403 Forbidden ❌</text><rect x="720" y="105" width="240" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="296.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="840" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">本地 Spring Boot (localhost:8080)</text><rect x="740" y="165" width="200" height="110" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="840.0" y="216.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">乾淨的業務請求</text><text x="840.0" y="238.0" text-anchor="middle" font-size="13" fill="#64748b">Header 帶入驗證資訊:

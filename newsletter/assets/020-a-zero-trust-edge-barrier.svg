<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="562" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Zero Trust 邊緣身分驗證與 Webhook Bypass 混合防護</text><text x="500" y="75" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">防線前移到全球 Anycast 邊緣：人類走 SSO/OTP 驗證，機器 Webhook 走 Bypass 繞過</text><rect x="40" y="110" width="190" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="135.0" y="296.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">公網存取來源</text><rect x="60" y="145" width="150" height="80" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="135.0" y="181.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">人類訪客 / 員工

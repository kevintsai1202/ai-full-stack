HMAC-SHA256 驗簽</text><text x="840" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">🛡️ 連線碰不到惡意流量！</text><defs><marker id="m13010" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8"/></marker></defs><line x1="210" y1="185" x2="300" y2="185" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#m13010)"/><defs><marker id="m9274" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="210" y1="290" x2="300" y2="290" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m9274)"/><defs><marker id="m32863" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="210" y1="395" x2="300" y2="395" stroke="#dc2626" stroke-width="2.0" marker-end="url(#m32863)"/><defs><marker id="m30607" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="650" y1="192" x2="740" y2="192" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m30607)"/><text x="695.0" y="184.0" text-anchor="middle" font-size="14" fill="#0f766e" font-weight="600">QUIC 轉發</text><defs><marker id="m59759" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="650" y1="287" x2="740" y2="340" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m59759)"/><text x="695.0" y="305.5" text-anchor="middle" font-size="14" fill="#0f766e" font-weight="600">QUIC 轉發</text><text x="500" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">✓ 未登入者與惡意爬蟲連本地電腦的 TCP 握手都碰不到，在邊緣直接被擋下，徹底守護 AI Token 帳單</text><text x="500" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">✓ 後端無須自建複雜 OAuth / JWT 登入系統，零維護成本享有企業級 Google 登入與 OTP 團隊白名單</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="562" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Tunnel 底層連線：4 條 QUIC 平行長連線與多工傳輸</text><text x="500" y="75" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">cloudflared 不是一般 HTTP 代理，而是主動與邊緣建立 4 條 QUIC 加密通道</text><rect x="40" y="110" width="180" height="360" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="130.0" y="286.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">本地電腦</text><text x="130.0" y="308.0" text-anchor="middle" font-size="13" fill="#64748b">cloudflared Agent</text><text x="130" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Spring Boot :8080</text><text x="130" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">React Vite :5173</text><text x="130" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">WebSocket /ws</text><text x="130" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">SSE AI Stream</text><text x="130" y="390" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">單一 Agent 出站</text><rect x="270" y="120" width="460" height="75" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="153.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">QUIC 通道 #1 (UDP 7844)</text><text x="500.0" y="175.5" text-anchor="middle" font-size="13" fill="#64748b">Stream A: REST API 請求與回應</text><defs><marker id="m3059" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="220" y1="157" x2="270" y2="157" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m3059)"/><defs><marker id="m95754" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="730" y1="157" x2="780" y2="157" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m95754)"/><rect x="270" y="210" width="460" height="75" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="500.0" y="243.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">QUIC 通道 #2 (UDP 7844)</text><text x="500.0" y="265.5" text-anchor="middle" font-size="13" fill="#64748b">Stream B: React HTML / JS / CSS 靜態資源</text><defs><marker id="m64535" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8"/></marker></defs><line x1="220" y1="247" x2="270" y2="247" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#m64535)"/><defs><marker id="m64487" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8"/></marker></defs><line x1="730" y1="247" x2="780" y2="247" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#m64487)"/><rect x="270" y="300" width="460" height="75" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="500.0" y="333.5" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">QUIC 通道 #3 (UDP 7844)</text><text x="500.0" y="355.5" text-anchor="middle" font-size="13" fill="#64748b">Stream C: Spring AI SSE 串流打字機</text><defs><marker id="m39563" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#d97706"/></marker></defs><line x1="220" y1="337" x2="270" y2="337" stroke="#d97706" stroke-width="2.0" marker-end="url(#m39563)"/><defs><marker id="m88164" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#d97706"/></marker></defs><line x1="730" y1="337" x2="780" y2="337" stroke="#d97706" stroke-width="2.0" marker-end="url(#m88164)"/><rect x="270" y="390" width="460" height="75" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="423.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">QUIC 通道 #4 (UDP 7844)</text><text x="500.0" y="445.5" text-anchor="middle" font-size="13" fill="#64748b">Stream D: WebSocket 雙向即時通訊</text><defs><marker id="m23985" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="220" y1="427" x2="270" y2="427" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m23985)"/><defs><marker id="m68073" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker></defs><line x1="730" y1="427" x2="780" y2="427" stroke="#0f766e" stroke-width="2.0" marker-end="url(#m68073)"/><rect x="780" y="110" width="180" height="360" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="870.0" y="286.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Cloudflare 邊緣</text><text x="870.0" y="308.0" text-anchor="middle" font-size="13" fill="#64748b">Anycast Edge Mesh</text><text x="870" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">全球 300+ 城市節點</text><text x="870" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">自動負載平衡</text><text x="870" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">DDoS 防護 + Anycast</text><text x="870" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">自動容錯轉移 (HA)</text><text x="870" y="390" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">免費自動 SSL 憑證</text><text x="500" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">✓ 多工傳輸（Multiplexing）：所有請求在 4 條連線內並行分流，徹底消滅 TCP 隊頭阻塞（Head-of-Line Blocking）</text><text x="500" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">✓ 高可用架構：4 條連線分別連往不同邊緣伺服器，單點斷線毫秒級自動切換，連線不中斷</text></svg>
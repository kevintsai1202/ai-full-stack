<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="360" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">收 Webhook 的正確姿勢：四道關卡</text><defs><marker id="m66559" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#d97706"/></marker></defs><line x1="10" y1="155" x2="58" y2="155" stroke="#d97706" stroke-width="2.6" marker-end="url(#m66559)"/><text x="30" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#d97706">webhook</text><rect x="60" y="110" width="200" height="90" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="160.0" y="151.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">① 驗章</text><text x="160.0" y="173.0" text-anchor="middle" font-size="13" fill="#64748b">HMAC＋常數時間比較</text><defs><marker id="m34733" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="260" y1="155" x2="298" y2="155" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#m34733)"/><rect x="300" y="110" width="200" height="90" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="400.0" y="151.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">② 去重</text><text x="400.0" y="173.0" text-anchor="middle" font-size="13" fill="#64748b">event_id 唯一約束兜底</text><defs><marker id="m74476" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="500" y1="155" x2="538" y2="155" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#m74476)"/><rect x="540" y="110" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="640.0" y="151.0" text-anchor="middle" font-size="17" font-weight="700" fill="#d97706">③ 立刻回 200</text><text x="640.0" y="173.0" text-anchor="middle" font-size="13" fill="#64748b">先簽收、重活丟佇列</text><defs><marker id="m87850" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="740" y1="155" x2="778" y2="155" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#m87850)"/><rect x="780" y="110" width="200" height="90" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="880.0" y="151.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">④ 狀態機</text><text x="880.0" y="173.0" text-anchor="middle" font-size="13" fill="#64748b">只進不退，擋亂序</text><defs><marker id="m27636" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="160" y1="200" x2="160" y2="240" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#m27636)"/><text x="160" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">假請求 → 401 拒收</text><defs><marker id="m4890" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="400" y1="200" x2="400" y2="240" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#m4890)"/><text x="400" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">重複事件 → 安靜返回</text><defs><marker id="m92415" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker></defs><line x1="640" y1="200" x2="640" y2="240" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#m92415)"/><text x="640" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">逾時重送風暴 ✗</text><defs><marker id="m61617" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="880" y1="200" x2="880" y2="240" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#m61617)"/><text x="880" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">舊事件晚到 → 忽略</text><text x="500" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">這四道工，本質是在 HTTP 上手工補回「訊息佇列」原生提供的保證</text></svg>
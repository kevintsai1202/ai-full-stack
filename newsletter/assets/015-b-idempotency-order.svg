<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="430" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">同樣 10 條執行緒搶同一個事件</text><line x1="500" y1="70" x2="500" y2="360" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,6"/><text x="255" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">先卡鍵：insert 讓資料庫擋</text><rect x="135" y="110" width="240" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="255.0" y="139.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">10 條執行緒同時進來</text><defs><marker id="m21409" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="255" y1="156" x2="255" y2="186" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m21409)"/><rect x="135" y="190" width="240" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="255.0" y="221.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">insert 冪等鍵</text><text x="255" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">主鍵約束：檢查與佔位</text><text x="255" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">是同一個原子操作</text><defs><marker id="m66120" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="255" y1="296" x2="255" y2="322" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m66120)"/><rect x="180" y="326" width="150" height="44" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="255.0" y="354.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">1 條通過</text><text x="255" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">實測 LLM 呼叫次數 ＝ 1</text><text x="745" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">先查再做：中間有空隙</text><rect x="625" y="110" width="240" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="745.0" y="139.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">10 條執行緒同時進來</text><defs><marker id="m77012" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="745" y1="156" x2="745" y2="186" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m77012)"/><rect x="625" y="190" width="240" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="745.0" y="221.0" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">select 查處理過沒有</text><text x="745" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">查與寫之間的空隙裡，</text><text x="745" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">十條全都查到「還沒處理」</text><defs><marker id="m36124" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="745" y1="296" x2="745" y2="322" stroke="#dc2626" stroke-width="2.0" marker-end="url(#m36124)"/><rect x="670" y="326" width="150" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="745.0" y="354.0" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">10 條全過</text><text x="745" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">實測 LLM 呼叫次數 ＝ 10</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="430" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">SSE：一條不掛斷的 HTTP，瀏覽器原生自動重連</text><rect x="60" y="90" width="150" height="250" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="135.0" y="211.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">瀏覽器</text><text x="135.0" y="233.0" text-anchor="middle" font-size="13" fill="#64748b">new EventSource()</text><rect x="790" y="90" width="150" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="865.0" y="211.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">伺服器</text><text x="865.0" y="233.0" text-anchor="middle" font-size="13" fill="#64748b">text/event-stream</text><defs><marker id="m68227" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/></marker></defs><line x1="210" y1="125" x2="790" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#m68227)"/><text x="500.0" y="117.0" text-anchor="middle" font-size="14" fill="#64748b" font-weight="600">GET /api/stream（普通 HTTP）</text><line x1="210" y1="150" x2="790" y2="150" stroke="#0f766e" stroke-width="4" opacity="0.25"/><rect x="700" y="168" width="86" height="30" rx="6" fill="#d9f1ec" stroke="#0f766e"/><text x="743" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">data: 今</text><rect x="590" y="168" width="86" height="30" rx="6" fill="#d9f1ec" stroke="#0f766e"/><text x="633" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">data: 天</text><rect x="480" y="168" width="86" height="30" rx="6" fill="#d9f1ec" stroke="#0f766e"/><text x="523" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">data: 天</text><rect x="370" y="168" width="86" height="30" rx="6" fill="#d9f1ec" stroke="#0f766e"/><text x="413" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">data: 氣</text><rect x="260" y="168" width="86" height="30" rx="6" fill="#d9f1ec" stroke="#0f766e"/><text x="303" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">data: …</text><text x="500" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">◀── 事件一段一段推過來（AI 打字機效果的本體）</text><rect x="330" y="250" width="340" height="34" rx="8" fill="#fde8e8" stroke="#dc2626"/><text x="500" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">✂ 連線中斷</text><defs><marker id="m97660" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8"/></marker></defs><line x1="210" y1="315" x2="790" y2="315" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#m97660)"/><text x="500.0" y="307.0" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="600">瀏覽器自動重連，帶 Last-Event-ID: 42</text><text x="500" y="355" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">伺服器據此補發漏掉的事件——重連機制是規格內建，不用自己寫</text><text x="500" y="395" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">限制：單向（伺服器→瀏覽器）、純文字 UTF-8</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="490" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">一次摘要產生，留下六行軌跡</text><text x="500" y="76" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">trace_id = trace-a（同一次執行的六個步驟共用）</text><rect x="60" y="96" width="190" height="40" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="155.0" y="122.0" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">PROMPT</text><text x="266" y="122" text-anchor="start" font-size="14" font-weight="400" fill="#1e293b">system prompt v3 ＋ 客戶 42 的近況請求</text><text x="940" y="122" text-anchor="end" font-size="13" font-weight="400" fill="#64748b">320 tokens</text><rect x="60" y="144" width="190" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="155.0" y="170.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">TOOL_CALL</text><text x="266" y="170" text-anchor="start" font-size="14" font-weight="400" fill="#1e293b">findRecentInteractions(customerId=42)</text><text x="940" y="170" text-anchor="end" font-size="13" font-weight="400" fill="#64748b">—</text><rect x="60" y="192" width="190" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="155.0" y="218.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">TOOL_RESULT</text><text x="266" y="218" text-anchor="start" font-size="14" font-weight="400" fill="#1e293b">回傳 5 筆互動紀錄</text><text x="940" y="218" text-anchor="end" font-size="13" font-weight="400" fill="#64748b">210 tokens</text><rect x="60" y="240" width="190" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="155.0" y="266.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">TOOL_CALL</text><text x="266" y="266" text-anchor="start" font-size="14" font-weight="400" fill="#1e293b">calculateHealthScore(customerId=42)</text><text x="940" y="266" text-anchor="end" font-size="13" font-weight="400" fill="#64748b">—</text><rect x="60" y="288" width="190" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="155.0" y="314.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">TOOL_RESULT</text><text x="266" y="314" text-anchor="start" font-size="14" font-weight="400" fill="#1e293b">健康分數 72</text><text x="940" y="314" text-anchor="end" font-size="13" font-weight="400" fill="#64748b">40 tokens</text><rect x="60" y="336" width="190" height="40" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="155.0" y="362.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">LLM_RESPONSE</text><text x="266" y="362" text-anchor="start" font-size="14" font-weight="400" fill="#1e293b">客戶 42 近期互動頻率下降，建議主動聯繫</text><text x="940" y="362" text-anchor="end" font-size="13" font-weight="400" fill="#64748b">180 tokens</text><line x1="60" y1="388" x2="940" y2="388" stroke="#e2e8f0" stroke-width="1.2"/><text x="940" y="414" text-anchor="end" font-size="15" font-weight="700" fill="#1e293b">總計 750 tokens</text><text x="500" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">「這份摘要是怎麼來的」——六行就交代完了</text></svg>
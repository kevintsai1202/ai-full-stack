<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="480" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">同一件事，使用者要等多久</text><text x="500" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">同步：使用者陪著 LLM 一起等</text><rect x="150" y="105" width="100" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="200.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">存檔</text><rect x="254" y="105" width="400" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="454.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">呼叫 LLM 產生摘要</text><rect x="658" y="105" width="120" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="718.0" y="135.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">回應使用者</text><line x1="150" y1="176" x2="778" y2="176" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,4"/><text x="464" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">使用者從按下儲存到畫面有反應：三十秒</text><text x="464" y="222" text-anchor="middle" font-size="13" font-weight="400" fill="#dc2626">等不及就重新整理再按一次 → LLM 再跑一次、再付一次錢</text><line x1="40" y1="244" x2="960" y2="244" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,6"/><text x="500" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">非同步：存檔立刻回應，摘要自己在背景跑</text><text x="60" y="320" text-anchor="start" font-size="13" font-weight="600" fill="#64748b">main</text><rect x="150" y="292" width="100" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="200.0" y="322.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">存檔</text><rect x="254" y="292" width="130" height="48" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="319.0" y="322.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">回應使用者</text><text x="319" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">零點幾秒就結束</text><text x="60" y="404" text-anchor="start" font-size="13" font-weight="600" fill="#64748b">背景</text><defs><marker id="m34196" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="200" y1="340" x2="200" y2="376" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m34196)"/><rect x="254" y="380" width="400" height="44" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="454.0" y="408.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">呼叫 LLM 產生摘要</text><text x="500" y="462" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">同一件事花的時間沒變——變的是「誰在等」</text></svg>
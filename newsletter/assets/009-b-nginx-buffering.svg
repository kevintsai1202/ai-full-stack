<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="460" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">最經典的 SSE 上線坑：反向代理緩衝</text><text x="80" y="100" text-anchor="start" font-size="17" font-weight="700" fill="#dc2626">✗ 預設（proxy_buffering on）：打字機變一次全吐</text><rect x="60" y="120" width="120" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="120.0" y="171.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">後端</text><rect x="420" y="120" width="160" height="90" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/><text x="500.0" y="161.0" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">Nginx</text><text x="500.0" y="183.0" text-anchor="middle" font-size="13" fill="#64748b">緩衝區把 token 憋住</text><rect x="820" y="120" width="120" height="90" rx="10" fill="#eef3fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="880.0" y="171.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">瀏覽器</text><rect x="200" y="152" width="36" height="26" rx="5" fill="#d9f1ec" stroke="#0f766e"/><rect x="250" y="152" width="36" height="26" rx="5" fill="#d9f1ec" stroke="#0f766e"/><rect x="300" y="152" width="36" height="26" rx="5" fill="#d9f1ec" stroke="#0f766e"/><rect x="350" y="152" width="36" height="26" rx="5" fill="#d9f1ec" stroke="#0f766e"/><defs><marker id="m29401" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker></defs><line x1="590" y1="165" x2="820" y2="165" stroke="#dc2626" stroke-width="2.2" marker-end="url(#m29401)"/><text x="705.0" y="157.0" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="600">……最後一次全吐出來</text><text x="80" y="280" text-anchor="start" font-size="17" font-weight="700" fill="#0f766e">✓ 對 SSE 路徑關閉緩衝（proxy_buffer
fs><line x1="750" y1="345" x2="786" y2="345" stroke="#0f766e" stroke-width="1.6" marker-end="url(#m82884)"/><text x="500" y="430" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">症狀辨識：本機順暢、上線整段憋住＝九成是代理緩衝</text></svg>
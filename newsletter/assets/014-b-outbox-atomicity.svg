<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="400" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Outbox：把事件變成一筆資料</text><rect x="50" y="98" width="340" height="150" rx="12" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6,5"/><text x="220" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">同一個交易</text><rect x="75" y="118" width="290" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="220.0" y="149.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">更新客戶資料</text><rect x="75" y="182" width="290" height="50" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="220.0" y="213.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">寫入 outbox 一筆</text><defs><marker id="m23997" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="392" y1="143" x2="456" y2="128" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m23997)"/><rect x="466" y="104" width="200" height="48" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="566.0" y="134.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">commit：兩筆都在</text><defs><marker id="m46619" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="392" y1="207" x2="456" y2="222" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m46619)"/><rect x="466" y="198" width="200" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="566.0" y="228.0" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">rollback：兩筆都沒有</text><defs><marker id="m52793" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="670" y1="128" x2="722" y2="128" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m52793)"/><rect x="732" y="104" width="220" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="842.0" y="134.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">排程撈出未送出的事件</text><defs><marker id="m57047" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="842" y1="152" x2="842" y2="194" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m57047)"/><rect x="732" y="198" width="220" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="842.0" y="228.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">真的送出去</text><text x="500" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Outbox 把「兩件事要一起成功」降級成「一次資料庫交易」</text><text x="500" y="344" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">代價：多一張表、多一個排程——下游漏了會出事才值得</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="400" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">@Async 的三個陷阱：都不會報錯</text><rect x="40" y="90" width="260" height="215" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="170.0" y="203.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="170" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#d97706">① 自己呼叫自己</text><text x="170" y="160" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">同一個 bean 內</text><text x="170" y="182" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">this.generate()</text><text x="170" y="204" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">繞過了 proxy</text><line x1="70" y1="242" x2="270" y2="242" stroke="#e2e8f0" stroke-width="1.2"/><text x="170" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">實測 caller=main</text><text x="170" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">實測 執行於=main</text><text x="170" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">→ @Async 等於沒加</text><rect x="370" y="90" width="260" height="215" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="500.0" y="203.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="500" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#d97706">② 例外被吞掉</text><text x="500" y="160" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">void 方法拋例外時</text><text x="500" y="182" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">呼叫端早就返回了</text><text x="500" y="204" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">沒有人在等它</text><line x1="400" y1="242" x2="600" y2="242" stroke="#e2e8f0" stroke-width="1.2"/><text x="500" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">呼叫端抓不到例外</text><text x="500" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">只剩一行 SEVERE log</text><text x="500" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">→ 摘要空白且無提示</text><rect x="700" y="90" width="260" height="215" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="830.0" y="203.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b"></text><text x="830" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#d97706">③ 預設執行器</text><text x="830" y="160" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">沒有 taskExecutor bean</text><text x="830" y="182" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">就退回</text><text x="830" y="204" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">SimpleAsyncTaskExecutor</text><line x1="730" y1="242" x2="930" y2="242" stroke="#e2e8f0" stroke-width="1.2"/><text x="830" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">送 5 次＝5 條新執行緒</text><text x="830" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">不重用，也沒有上限</text><text x="830" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">→ 100 人存檔 100 條</text><text x="500" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">三個都不會報錯——程式照樣編譯、照樣執行，只是沒照你以為的方式跑</text></svg>
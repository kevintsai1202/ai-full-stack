<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="430" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">事件到底什麼時候該送出去</text><text x="40" y="96" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b">① @EventListener ＋ 交易 rollback</text><rect x="40" y="108" width="130" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="105.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">更新客戶資料</text><rect x="178" y="108" width="100" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="228.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">發事件</text><rect x="286" y="108" width="120" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="346.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">摘要開始跑</text><rect x="414" y="108" width="100" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="464.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">rollback</text><text x="540" y="136" text-anchor="start" font-size="14" font-weight="600" fill="#dc2626">→ 資料退回原狀，摘要卻已經產生並存檔</text><text x="40" y="196" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b">② @TransactionalEventListener ＋ 交易 rollback</text><rect x="40" y="208" width="130" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="105.0" y="236.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">更新客戶資料</text><rect x="178" y="208" width="190" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="273.0" y="236.0" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">事件掛起，等 commit</text><rect x="376" y="208" width="100" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="426.0" y="236.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">rollback</text><text x="540" y="236" text-anchor="start" font-size="14" font-weight="600" fill="#0f766e">→ 事件直接丟棄，摘要不會產生</text><text x="40" y="296" text-anchor="start" font-size="14" font-weight="700" fill="#1e293b">③ @TransactionalEventListener ＋ commit 後當機</text><rect x="40" y="308" width="130" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="105.0" y="336.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">更新客戶資料</text><rect x="178" y="308" width="110" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="233.0" y="336.0" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">事件掛起</text><rect x="296" y="308" width="110" height="44" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="351.0" y="336.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">commit 成功</text><rect x="414" y="308" width="90" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="459.0" y="336.0" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">當機</text><text x="540" y="336" text-anchor="start" font-size="14" font-weight="600" fill="#dc2626">→ 資料在，事件消失，沒有任何紀錄</text><text x="500" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Outbox 補的就是第三種：事件不放記憶體，跟資料寫進同一個交易</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="1000" height="430" fill="#ffffff"/><text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">同一個需求，兩種接法</text><line x1="500" y1="70" x2="500" y2="380" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,6"/><text x="250" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">直接呼叫：上游得認識每一個下游</text><rect x="150" y="140" width="200" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="250.0" y="174.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">updateCustomer</text><defs><marker id="m36012" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="250" y1="196" x2="130" y2="266" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m36012)"/><rect x="75" y="268" width="110" height="48" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="130.0" y="298.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">AI 摘要</text><defs><marker id="m97488" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="250" y1="196" x2="250" y2="266" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m97488)"/><rect x="195" y="268" width="110" height="48" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="250.0" y="298.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">業務通知</text><defs><marker id="m24803" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="250" y1="196" x2="370" y2="266" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m24803)"/><rect x="315" y="268" width="110" height="48" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="370.0" y="298.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">稽核紀錄</text><text x="250" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">每多一個下游，就回頭改一次 updateCustomer</text><text x="735" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">發事件：上游只宣告發生了什麼</text><rect x="635" y="108" width="200" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="735.0" y="140.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">updateCustomer</text><defs><marker id="m8333" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="735" y1="160" x2="735" y2="186" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m8333)"/><rect x="650" y="188" width="170" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="735.0" y="218.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">CustomerUpdated</text><defs><marker id="m70612" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="735" y1="236" x2="615" y2="266" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m70612)"/><rect x="560" y="268" width="110" height="48" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="615.0" y="298.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">AI 摘要</text><defs><marker id="m60398" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="735" y1="236" x2="735" y2="266" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m60398)"/><rect x="680" y="268" width="110" height="48" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="735.0" y="298.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">業務通知</text><defs><marker id="m78704" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#94a3b8"/></marker></defs><line x1="735" y1="236" x2="855" y2="266" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#m78704)"/><rect x="800" y="268" width="110" height="48" rx="10" fill="#d9f1ec" stroke="#0f766e" stroke-width="1.5"/><text x="855.0" y="298.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">稽核紀錄</text><text x="735" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">再加第四個下游，updateCustomer 一個字都不用改</text><text x="500" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">事件解的是「誰認識誰」的問題——是下游依賴上游，不是上游去認識下游</text></svg>
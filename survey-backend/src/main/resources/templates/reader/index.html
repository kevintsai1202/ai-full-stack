<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凱文大叔的電子報</title>
<meta name="description" content="RAG、AI Agent、全端實戰的實作細節與踩雷筆記，固定寄給訂閱者。">
<link rel="stylesheet" href="/r/reader.css">
<script src="/tracking.js" defer></script>
<script src="/r/reader-nav.js" defer></script>
<script src="/r/reader-share.js" defer></script>
</head>
<body>
<header class="site-head">
  <div class="site-head-inner">
    <a class="brand" href="/r/">凱文大叔的電子報</a>
    <nav><!--NAV_LINKS--></nav>
  </div>
</header>

<div class="wrap">
  <p class="page-kicker">每期一個可帶走的實作方法</p>
  <h1 class="page-title">把研究和實戰，整理成你能直接用的筆記</h1>
  <p class="page-intro">訂閱後你會收到 RAG、AI Agent 與全端實戰的踩雷筆記、AI 新技術觀察，以及課程與工具的專屬優惠。</p>

  <div class="card feature-card">
    <h2 class="section-title">訂閱電子報</h2>
    <!--SUBSCRIBE_BLOCK-->
  </div>

  <!--SURVEY_LIST-->

  <div class="supporting-links">
    <div>訂閱後首次登入會拿到初始點數，進階內容可用點數解鎖。<a href="/r/rules">看遊戲規則</a></div>
    <div>已經訂閱過了？<a href="/r/login">用 Email 登入</a>就能看歷史內容。</div>
  </div>

  <div class="foot">
    <p>每封信都有一鍵退訂，隨時可以走。</p>
  </div>
</div>

<script>
  // 訂閱表單：沿用既有 /api/survey 端點（consent=true 表示同意接收）
  // 邀請碼 ?ref= 隨訂閱一起送出，後端寫入 answers._ref；
  // 獎勵在被邀者點確認信後才發（見 /r/rules）
  const params = new URLSearchParams(location.search);
  const ref = params.get('ref');
  const share = params.get('share');

  const form = document.getElementById('subscribe-form');
  const msg = document.getElementById('msg');

  // 已登入時 server 端不渲染訂閱表單（改顯示身分區），此 script 直接不動作
  if (form) {
    /** 顯示提示訊息 */
    function showMsg(text, ok) {
      msg.textContent = text;
      msg.className = 'msg show ' + (ok ? 'ok' : 'err');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      window.ReaderAnalytics?.event('SUBSCRIBE_ATTEMPT', 'subscribe_attempt');
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        // source: "newsletter" 讓後端能與課程問卷（survey_form）區分，
        // 避免電子報訂閱者污染 /api/survey/stats 對外公開的問卷統計
        const body = { email: document.getElementById('email').value, consent: true, source: 'newsletter' };
        if (ref) { body.ref = ref; }
        // 文章來源只與推薦碼一起送出；後端會再次驗證 slug 格式。
        if (ref && share) { body.share = share; }
        const res = await fetch('/api/survey', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.status === 201 || res.status === 204) {
          window.ReaderAnalytics?.event('SUBSCRIBE_SUCCESS', 'subscribe_success');
          showMsg('已訂閱成功，歡迎信已經寄到你的信箱。', true);
          form.reset();
        } else {
          window.ReaderAnalytics?.event('SUBSCRIBE_ERROR', 'subscribe_error');
          showMsg('送出失敗，請確認 email 格式後再試一次。', false);
        }
      } catch (err) {
        window.ReaderAnalytics?.event('SUBSCRIBE_ERROR', 'subscribe_error');
        showMsg('連線失敗，請稍後再試。', false);
      } finally {
        button.disabled = false;
      }
    });
  }
</script>
<footer class="site-foot">
  <p>合作與聯絡：<a href="mailto:contact@springai.world">contact@springai.world</a></p>
</footer>
</body>
</html>

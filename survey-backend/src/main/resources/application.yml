spring:
  application:
    name: survey-backend
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://127.0.0.1:5432/survey}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # 全新空白資料庫：不要 baseline，否則會跳過 V1 導致 validate 找不到資料表
    # 顯式關閉 clean：訂閱名單的同意狀態是訂閱者親自點確認信給出的，清掉只能
    # 重新徵求（設計文件 §4.0 的硬約束）。Flyway 11 的預設值已是 true，
    # 但這條約束太重要，不依賴預設值。
    clean-disabled: true
  servlet:
    multipart:
      # 應用層仍會依圖片／文件類型做更嚴格的 5 MB／10 MB 檢查。
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:8080}
  # 由受信任反向代理（Zeabur）還原真實來源 IP，供登入防濫用節流使用。
  forward-headers-strategy: native
app:
  admin-api-key: ${ADMIN_API_KEY:dev-admin-key}
  security:
    # 本機若要沿用測試祕密，必須明確 opt-in；部署環境預設 fail-closed。
    allow-insecure-dev-secrets: ${APP_ALLOW_INSECURE_DEV_SECRETS:false}
  integrations:
    exam:
      # Exam 正式站 API 根網址與兩邊共用的唯讀 integration token。
      base-url: ${EXAM_INTEGRATION_BASE_URL:}
      token: ${EXAM_INTEGRATION_TOKEN:}
      scheduled-enabled: ${EXAM_SYNC_ENABLED:false}
      sync-cron: ${EXAM_SYNC_CRON:0 15 * * * *}
  audience:
    # 0 表示不自動清理；設定正整數後只清 raw_data，摘要與 Fact 仍保留。
    raw-retention-days: ${AUDIENCE_RAW_RETENTION_DAYS:0}
    retention-cron: ${AUDIENCE_RETENTION_CRON:0 35 3 * * *}
  media:
    # 本機與測試預設停用；正式環境啟用後若 MinIO 無法初始化會拒絕啟動。
    enabled: ${MEDIA_STORAGE_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:newsletter-media}
    region: ${MINIO_REGION:us-east-1}
    image-max-bytes: ${MEDIA_IMAGE_MAX_BYTES:5242880}
    file-max-bytes: ${MEDIA_FILE_MAX_BYTES:10485760}
    image-max-pixels: ${MEDIA_IMAGE_MAX_PIXELS:40000000}
  # 管理後台專用入口；設定後該 Host 只允許 admin.html 與 /api/admin/**。
  admin:
    entry-host: ${ADMIN_ENTRY_HOST:}
    emails: ${ADMIN_EMAILS:}
    # 管理後台的公開網址：判斷 session cookie 是否需帶 Secure（未設定時沿用 APP_PUBLIC_BASE_URL）
    base-url: ${ADMIN_BASE_URL:${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}}
    # JWT 簽章秘鑰（線上務必換成 32 字元以上的強隨機字串；與讀者站秘鑰刻意分離）
    jwt-secret: ${ADMIN_JWT_SECRET:dev-admin-jwt-secret-change-me-32chars}
    # 登入態有效天數
    jwt-ttl-days: ${ADMIN_JWT_TTL_DAYS:7}
  # 問卷公開入口；設定後會在此 Host 隱藏管理頁與管理 API。
  # 建議確認管理網域 DNS/HTTPS 正常後再設定，避免切換期間無法進入後台。
  survey:
    entry-host: ${SURVEY_ENTRY_HOST:}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5174,http://localhost:5174}
  # 退訂連結 HMAC 秘鑰（線上務必換成強隨機字串）
  unsubscribe-secret: ${UNSUBSCRIBE_SECRET:dev-unsub-secret}
  # 組退訂連結用的對外網址（= survey-backend 自己的公開網域；勿留結尾斜線）
  public-base-url: ${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}
  # 讀者端設定（部署設定，非產品參數；點數類參數存 DB 見 app_setting 表）
  reader:
    # 讀者網站的公開網址：文章、登入信與電子報 CTA 都使用這個網域。
    # 未設定時沿用 APP_PUBLIC_BASE_URL，確保本機與既有部署相容。
    base-url: ${READER_BASE_URL:${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}}
    # 讀者入口網域（不含協定與路徑）：來自這個 Host 的根路徑請求會被 302 導向 /r/。
    # 空值＝停用（本機開發與測試不受影響）。見 ReaderEntryHostFilter。
    entry-host: ${READER_ENTRY_HOST:}
    # JWT 簽章秘鑰（線上務必換成 32 字元以上的強隨機字串）
    jwt-secret: ${READER_JWT_SECRET:dev-reader-jwt-secret-change-me-32chars}
    # 登入態有效天數
    jwt-ttl-days: ${READER_JWT_TTL_DAYS:28}
    # magic link 連結有效分鐘數
    login-token-ttl-minutes: ${READER_LOGIN_TOKEN_TTL_MINUTES:15}
    # 登入信節流：同一 email 在 login-throttle-minutes 內最多寄幾封
    login-throttle-count: ${READER_LOGIN_THROTTLE_COUNT:3}
    login-throttle-minutes: ${READER_LOGIN_THROTTLE_MINUTES:15}
    # 同一來源 IP 與全站在相同視窗內的上限，避免輪替 Email 耗盡交易信額度。
    login-ip-throttle-count: ${READER_LOGIN_IP_THROTTLE_COUNT:20}
    login-global-throttle-count: ${READER_LOGIN_GLOBAL_THROTTLE_COUNT:200}
  # 寄信設定：api-key 空白時自動 fallback 成 NoopMailSender（不真寄）
  mail:
    api-key: ${SEND_MAIL_API:}
    # 寄件人顯示名稱：本系統為個人電子報系統（非課程專用），統一以個人名義寄出
    from: ${MAIL_FROM:凱文大叔 <noreply@springai.world>}
    reply-to: ${MAIL_REPLY_TO:}
    # 額度偵測用的 Zeabur 帳號 token（sk-...，即 CLI 登入的那把，非上面的 ZSend 寄信金鑰）；
    # 留空則停用動態偵測，改用下面的 fallback-quota
    zeabur-token: ${ZEABUR_API_TOKEN:}
    # 偵測不可用（未設 token 或 API 失敗）時採用的保守額度（封）
    fallback-quota: ${MAIL_FALLBACK_QUOTA:100}
    # 保留給交易信（登入／確認／歡迎）的額度，行銷群發不得吃掉這部分；
    # 群發把額度用光會導致讀者無法登入，那是產品故障而非延遲
    transactional-reserve: ${MAIL_TRANSACTIONAL_RESERVE:50}

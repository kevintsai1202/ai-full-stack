<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">從一句話到可行性評估</title>
  <desc id="desc">指定產物格式，讓風險與未知數在寫程式前被看見</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1728"/><stop offset="1" stop-color="#182b48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8bb8ff"/></marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="700" y="52" fill="#ffffff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="32" font-weight="750" text-anchor="middle"><tspan x="700" dy="0">從一句話到可行性評估</tspan></text>
  <text x="700" y="96" fill="#a7bad7" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">指定產物格式，讓風險與未知數在寫程式前被看見</tspan></text>
  
  <g filter="url(#shadow)"><rect x="80" y="210" width="250" height="82" rx="41" fill="#173e45" stroke="#ef8c6b" stroke-width="3"/><text x="205" y="251" fill="#effff8" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="205" dy="0">模糊需求</tspan></text></g>
  <path d="M330 251 L410 251" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="410" y="190" width="250" height="122" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="535" y="235" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="535" dy="0">固定欄位</tspan><tspan x="535" dy="34">可行性報告</tspan></text></g>
  <path d="M660 251 L740 251" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon points="830,188 920,251 830,314 740,251" fill="#4a3821" stroke="#f3b45c" stroke-width="3"/><text x="830" y="251" fill="#fff7e8" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="830" dy="0">有未知數？</tspan></text></g>
  <path d="M920 251 L1010 251" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="965" y="239" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="965" dy="0">有</tspan></text>
  <g filter="url(#shadow)"><rect x="1010" y="190" width="250" height="122" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="1135" y="235" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="1135" dy="0">設計 spike</tspan><tspan x="1135" dy="34">先驗證</tspan></text></g>
  <path d="M830 314 L830 420" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="830" y="355" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="830" dy="0">無／已釐清</tspan></text>
  <g filter="url(#shadow)"><polygon points="718,420 942,420 970,465 942,510 718,510 690,465" fill="#432c55" stroke="#d986e8" stroke-width="3"/><text x="830" y="450" fill="#fff0ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="830" dy="0">可進入</tspan><tspan x="830" dy="32">設計期</tspan></text></g>
  <text x="700" y="370" fill="#d9e7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="22" font-weight="600" text-anchor="middle"><tspan x="700" dy="0">五個欄位：技術、難度、風險、資源、驗證順序</tspan></text>
  <g transform="translate(58 548)">
    <rect x="0" y="0" width="18" height="18" rx="5" fill="#213653" stroke="#4f8cff" stroke-width="2"/><text x="28" y="15" fill="#a7bad7" font-size="16">Action</text>
    <rect x="110" y="0" width="52" height="18" rx="9" fill="#173e45" stroke="#42cfa0" stroke-width="2"/><text x="174" y="15" fill="#a7bad7" font-size="16">狀態／資料</text>
    <polygon points="300,9 312,0 324,9 312,18" fill="#4a3821" stroke="#f3b45c" stroke-width="2"/><text x="336" y="15" fill="#a7bad7" font-size="16">判斷</text>
    <polygon points="405,0 445,0 457,9 445,18 405,18 393,9" fill="#432c55" stroke="#d986e8" stroke-width="2"/><text x="469" y="15" fill="#a7bad7" font-size="16">交付</text>
  </g></svg>
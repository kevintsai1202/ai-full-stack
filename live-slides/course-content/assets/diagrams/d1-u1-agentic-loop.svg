<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Coding 審查迴圈</title>
  <desc id="desc">人的角色不是逐行指揮，而是審查每一站的產物</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1728"/><stop offset="1" stop-color="#182b48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8bb8ff"/></marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="700" y="52" fill="#ffffff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="32" font-weight="750" text-anchor="middle"><tspan x="700" dy="0">Agentic Coding 審查迴圈</tspan></text>
  <text x="700" y="96" fill="#a7bad7" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">人的角色不是逐行指揮，而是審查每一站的產物</tspan></text>
  
  <g filter="url(#shadow)"><rect x="90" y="190" width="210" height="100" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="195" y="240" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="195" dy="0">理解需求</tspan></text></g>
  <g filter="url(#shadow)"><rect x="370" y="190" width="210" height="100" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="475" y="240" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="475" dy="0">規劃</tspan></text></g>
  <g filter="url(#shadow)"><rect x="650" y="190" width="210" height="100" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="755" y="240" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="755" dy="0">生成</tspan></text></g>
  <g filter="url(#shadow)"><rect x="930" y="190" width="210" height="100" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="1035" y="240" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="1035" dy="0">驗證</tspan></text></g>
  <g filter="url(#shadow)"><polygon points="1260,175 1330,240 1260,305 1190,240" fill="#4a3821" stroke="#f3b45c" stroke-width="3"/><text x="1260" y="225" fill="#fff7e8" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1260" dy="0">證據</tspan><tspan x="1260" dy="30">足夠？</tspan></text></g>
  <path d="M300 240 L370 240" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M580 240 L650 240" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M860 240 L930 240" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1140 240 L1190 240" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1260 305 L1260 430" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="1260" y="355.5" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="1260" dy="0">否</tspan></text><path d="M1190 470 L300 470" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="745" y="458" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="745" dy="0">回到需求／計畫</tspan></text><path d="M1330 240 L1360 240" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="1345" y="228" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="1345" dy="0">是</tspan></text>
  <g filter="url(#shadow)"><polygon points="1198,420 1322,420 1350,465 1322,510 1198,510 1170,465" fill="#432c55" stroke="#d986e8" stroke-width="3"/><text x="1260" y="450" fill="#fff0ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1260" dy="0">可審查</tspan><tspan x="1260" dy="32">交付物</tspan></text></g>
  <text x="700" y="505" fill="#d9e7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="700" dy="0">每一步都留下可閱讀、可驗證、可重跑的中間產物</tspan></text>
  <g transform="translate(58 548)">
    <rect x="0" y="0" width="18" height="18" rx="5" fill="#213653" stroke="#4f8cff" stroke-width="2"/><text x="28" y="15" fill="#a7bad7" font-size="16">Action</text>
    <rect x="110" y="0" width="52" height="18" rx="9" fill="#173e45" stroke="#42cfa0" stroke-width="2"/><text x="174" y="15" fill="#a7bad7" font-size="16">狀態／資料</text>
    <polygon points="300,9 312,0 324,9 312,18" fill="#4a3821" stroke="#f3b45c" stroke-width="2"/><text x="336" y="15" fill="#a7bad7" font-size="16">判斷</text>
    <polygon points="405,0 445,0 457,9 445,18 405,18 393,9" fill="#432c55" stroke="#d986e8" stroke-width="2"/><text x="469" y="15" fill="#a7bad7" font-size="16">交付</text>
  </g></svg>
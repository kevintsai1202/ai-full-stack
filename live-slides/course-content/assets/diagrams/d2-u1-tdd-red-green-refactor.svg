<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">TDD：Red → Green → Refactor</title>
  <desc id="desc">先用測試描述行為，再用最小實作滿足它</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1728"/><stop offset="1" stop-color="#182b48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8bb8ff"/></marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="700" y="52" fill="#ffffff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="32" font-weight="750" text-anchor="middle"><tspan x="700" dy="0">TDD：Red → Green → Refactor</tspan></text>
  <text x="700" y="96" fill="#a7bad7" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">先用測試描述行為，再用最小實作滿足它</tspan></text>
  
  <g filter="url(#shadow)"><rect x="85" y="215" width="220" height="90" rx="45" fill="#173e45" stroke="#ef8c6b" stroke-width="3"/><text x="195" y="260" fill="#effff8" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195" dy="0">測試案例</tspan></text></g>
  <path d="M305 260 L390 260" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="390" y="195" width="230" height="130" rx="14" fill="#213653" stroke="#ef8c6b" stroke-width="3"/><text x="505" y="244" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="505" dy="0">Red</tspan><tspan x="505" dy="34">確認有意義的失敗</tspan></text></g>
  <path d="M620 260 L705 260" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="705" y="195" width="230" height="130" rx="14" fill="#213653" stroke="#42cfa0" stroke-width="3"/><text x="820" y="244" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="820" dy="0">Green</tspan><tspan x="820" dy="34">最小實作通過</tspan></text></g>
  <path d="M935 260 L1020 260" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1020" y="195" width="230" height="130" rx="14" fill="#213653" stroke="#d986e8" stroke-width="3"/><text x="1135" y="244" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="1135" dy="0">Refactor</tspan><tspan x="1135" dy="34">不改變行為</tspan></text></g>
  <path d="M1135 325 L1135 430" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="1135" y="365.5" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="1135" dy="0">下一個案例</tspan></text>
  <path d="M1135 430 L195 430" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="700" y="380" fill="#d9e7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="22" font-weight="600" text-anchor="middle"><tspan x="700" dy="0">紅燈不是任何錯誤；必須能說明失敗正好對應尚未滿足的規格</tspan></text>
  <g transform="translate(58 548)">
    <rect x="0" y="0" width="18" height="18" rx="5" fill="#213653" stroke="#4f8cff" stroke-width="2"/><text x="28" y="15" fill="#a7bad7" font-size="16">Action</text>
    <rect x="110" y="0" width="52" height="18" rx="9" fill="#173e45" stroke="#42cfa0" stroke-width="2"/><text x="174" y="15" fill="#a7bad7" font-size="16">狀態／資料</text>
    <polygon points="300,9 312,0 324,9 312,18" fill="#4a3821" stroke="#f3b45c" stroke-width="2"/><text x="336" y="15" fill="#a7bad7" font-size="16">判斷</text>
    <polygon points="405,0 445,0 457,9 445,18 405,18 393,9" fill="#432c55" stroke="#d986e8" stroke-width="2"/><text x="469" y="15" fill="#a7bad7" font-size="16">交付</text>
  </g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">基準式稽核：兩條路徑，一份報告</title>
  <desc id="desc">程式碼風險與供應鏈風險要分開檢查</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1728"/><stop offset="1" stop-color="#182b48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8bb8ff"/></marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="700" y="52" fill="#ffffff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="32" font-weight="750" text-anchor="middle"><tspan x="700" dy="0">基準式稽核：兩條路徑，一份報告</tspan></text>
  <text x="700" y="96" fill="#a7bad7" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">程式碼風險與供應鏈風險要分開檢查</tspan></text>
  
  <g filter="url(#shadow)"><rect x="70" y="205" width="230" height="90" rx="45" fill="#173e45" stroke="#42cfa0" stroke-width="3"/><text x="185" y="250" fill="#effff8" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="185" dy="0">專案版本</tspan></text></g>
  <path d="M300 250 L390 250" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="390" y="170" width="260" height="105" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="520" y="206.5" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="520" dy="0">程式碼稽核</tspan><tspan x="520" dy="34">OWASP／CWE</tspan></text></g>
  <path d="M300 250 L390 440" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="390" y="390" width="260" height="105" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="520" y="426.5" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="520" dy="0">相依稽核</tspan><tspan x="520" dy="34">npm audit／CVE</tspan></text></g>
  <path d="M650 223 L760 310" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M650 442 L760 350" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="760" y="250" width="260" height="105" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="890" y="286.5" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="890" dy="0">證據整理</tspan><tspan x="890" dy="34">命中／未命中</tspan></text></g>
  <path d="M1020 302 L1110 302" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon points="1138,255 1312,255 1340,302.5 1312,350 1138,350 1110,302.5" fill="#432c55" stroke="#d986e8" stroke-width="3"/><text x="1225" y="287.5" fill="#fff0ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1225" dy="0">稽核報告</tspan><tspan x="1225" dy="32">含限制</tspan></text></g>
  <text x="700" y="545" fill="#d9e7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="22" font-weight="600" text-anchor="middle"><tspan x="700" dy="0">基準能提高覆蓋率，但不能把稽核報告冒充滲透測試</tspan></text>
  <g transform="translate(58 548)">
    <rect x="0" y="0" width="18" height="18" rx="5" fill="#213653" stroke="#4f8cff" stroke-width="2"/><text x="28" y="15" fill="#a7bad7" font-size="16">Action</text>
    <rect x="110" y="0" width="52" height="18" rx="9" fill="#173e45" stroke="#42cfa0" stroke-width="2"/><text x="174" y="15" fill="#a7bad7" font-size="16">狀態／資料</text>
    <polygon points="300,9 312,0 324,9 312,18" fill="#4a3821" stroke="#f3b45c" stroke-width="2"/><text x="336" y="15" fill="#a7bad7" font-size="16">判斷</text>
    <polygon points="405,0 445,0 457,9 445,18 405,18 393,9" fill="#432c55" stroke="#d986e8" stroke-width="2"/><text x="469" y="15" fill="#a7bad7" font-size="16">交付</text>
  </g></svg>
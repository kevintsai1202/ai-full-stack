<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">發現到修補的證據鏈</title>
  <desc id="desc">每一個 finding 都要能重現、修補、回歸</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1728"/><stop offset="1" stop-color="#182b48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8bb8ff"/></marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="700" y="52" fill="#ffffff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="32" font-weight="750" text-anchor="middle"><tspan x="700" dy="0">發現到修補的證據鏈</tspan></text>
  <text x="700" y="96" fill="#a7bad7" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">每一個 finding 都要能重現、修補、回歸</tspan></text>
  
  <g filter="url(#shadow)"><rect x="70" y="220" width="210" height="90" rx="45" fill="#173e45" stroke="#42cfa0" stroke-width="3"/><text x="175" y="265" fill="#effff8" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="175" dy="0">Finding</tspan></text></g>
  <path d="M280 265 L365 265" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="365" y="195" width="220" height="130" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="475" y="244" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="475" dy="0">重現</tspan><tspan x="475" dy="34">保存原始證據</tspan></text></g>
  <path d="M585 265 L670 265" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="670" y="195" width="220" height="130" rx="14" fill="#213653" stroke="#4f8cff" stroke-width="3"/><text x="780" y="244" fill="#f2f7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="780" dy="0">修補</tspan><tspan x="780" dy="34">對外／內部分流</tspan></text></g>
  <path d="M890 265 L975 265" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon points="1065,190 1155,265 1065,340 975,265" fill="#4a3821" stroke="#f3b45c" stroke-width="3"/><text x="1065" y="250" fill="#fff7e8" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1065" dy="0">回歸</tspan><tspan x="1065" dy="30">通過？</tspan></text></g>
  <path d="M1155 265 L1250 265" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="1202.5" y="253" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="1202.5" dy="0">是</tspan></text>
  <g filter="url(#shadow)"><polygon points="1198,205 1332,205 1360,252.5 1332,300 1198,300 1170,252.5" fill="#432c55" stroke="#d986e8" stroke-width="3"/><text x="1265" y="237.5" fill="#fff0ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1265" dy="0">關閉</tspan><tspan x="1265" dy="32">並記錄</tspan></text></g>
  <path d="M1065 340 L1065 445" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="1065" y="380.5" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="1065" dy="0">否</tspan></text>
  <path d="M1065 445 L475 445" fill="none" stroke="#8bb8ff" stroke-width="4" marker-end="url(#arrow)"/><text x="770" y="433" fill="#b9cdf0" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><tspan x="770" dy="0">回到修補</tspan></text>
  <text x="700" y="380" fill="#d9e7ff" font-family="Microsoft JhengHei, Noto Sans TC, Segoe UI, sans-serif" font-size="22" font-weight="600" text-anchor="middle"><tspan x="700" dy="0">不能只把錯誤藏起來：資訊要從回應移到適當日誌，並留下回歸測試</tspan></text>
  <g transform="translate(58 548)">
    <rect x="0" y="0" width="18" height="18" rx="5" fill="#213653" stroke="#4f8cff" stroke-width="2"/><text x="28" y="15" fill="#a7bad7" font-size="16">Action</text>
    <rect x="110" y="0" width="52" height="18" rx="9" fill="#173e45" stroke="#42cfa0" stroke-width="2"/><text x="174" y="15" fill="#a7bad7" font-size="16">狀態／資料</text>
    <polygon points="300,9 312,0 324,9 312,18" fill="#4a3821" stroke="#f3b45c" stroke-width="2"/><text x="336" y="15" fill="#a7bad7" font-size="16">判斷</text>
    <polygon points="405,0 445,0 457,9 445,18 405,18 393,9" fill="#432c55" stroke="#d986e8" stroke-width="2"/><text x="469" y="15" fill="#a7bad7" font-size="16">交付</text>
  </g></svg>
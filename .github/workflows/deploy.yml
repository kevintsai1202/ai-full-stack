name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  # 允許手動觸發執行
  workflow_dispatch:

# 設定權限，允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 限制同時間只能有一個 Pages 部署在執行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        shell: bash
        run: |
          # 將兩個靜態入口組合成同一個 Pages artifact，避免公開整個 repository。
          mkdir -p ./_site/live-slides/assets
          cp -R ./teaching-site/. ./_site/
          cp ./live-slides/index.html ./_site/live-slides/index.html
          cp -R ./live-slides/assets/. ./_site/live-slides/assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上傳包含 teaching-site 根站與 live-slides 子站的靜態內容。
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
